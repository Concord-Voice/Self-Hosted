sonar.projectKey=Concord-Voice_Self-Hosted
sonar.organization=concord-voice

# ── Narrowed scope (ADR-0017 / #1430) ────────────────────────────────────────
# SonarCloud owns COVERAGE + NEW-CODE QUALITY + AI-CODE-ASSURANCE only.
# Security-taint detection (injection-tagged vulnerability rules) is owned by
# CodeQL security-extended (codeql.yml, #1424) + Semgrep (semgrep.yml, #1426);
# the corresponding Sonar sensors are retired via quality-PROFILE deactivation
# (scripts/sonar/narrow-security-profiles.sh) — there is no scanner property
# for this, so nothing below configures it. Do NOT add rule-tuning properties
# here: prohibited by the AI-Code-Assurance policy (CLAUDE.md).

# ── Source & Test Directories ────────────────────────────────────────────────
sonar.sources=packages/e2ee-client/src,packages/protocol/src,client/admin/src,services/control-plane,services/media-plane/src
sonar.tests=packages/e2ee-client/tests,packages/protocol/tests,client/admin/src,client/admin/e2e,services/media-plane/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*_test.go

# ── TypeScript Projects ──────────────────────────────────────────────────────
# List the concrete per-project configs that own sources (admin's
# tsconfig.json is references-only, so its app/e2e/node configs are named
# directly). Each is in SUPPORT in scripts/sonar/prepare-protected-pr-analysis.py,
# so it also exists in the protected PR analysis tree.
sonar.typescript.tsconfigPaths=packages/e2ee-client/tsconfig.json,packages/protocol/tsconfig.json,client/admin/tsconfig.app.json,client/admin/tsconfig.e2e.json,client/admin/tsconfig.node.json,services/media-plane/tsconfig.json

# ── Coverage Reports ─────────────────────────────────────────────────────────
# Generated by parallel CI jobs, downloaded as artifacts before scan
# coverage/lcov.info is the packages/* lane (build.yml's `desktop` key).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,client/admin/coverage/lcov.info,services/media-plane/coverage/lcov.info
sonar.go.coverage.reportPaths=services/control-plane/coverage.out

# ── Source Exclusions (completely ignored by all analysis) ────────────────────
# *.woff2/*.otf: binary fonts under client/admin/src/assets/fonts — the text/secrets
# sensor reads every indexed file as UTF-8 and raised "Invalid character encountered"
# WARNs (the UI-visible "problems with file encoding" analysis warning).
# *.sql: every SQL file here is PostgreSQL (migrations + test bootstrap scripts),
# but the scanner assigns .sql to the Oracle PL/SQL analyzer, which raised the
# "Data Dictionary is not configured" analysis warning. Wrong-language scoping,
# not rule tuning: no rule or quality profile changes.
sonar.exclusions=\
  **/migrations/**,\
  **/*.sql,\
  **/node_modules/**,\
  **/dist/**,\
  **/out/**,\
  **/*.woff2,\
  **/*.otf,\
  **/data/emoji/*.json,\
  **/tests/benchmarks/**,\
  **/email/templates/**,\
  **/cmd/server/main.go,\
  **/cmd/migrate*/**.go,\
  client/admin/src/**/*.test.ts,\
  client/admin/src/**/*.test.tsx,\
  client/admin/src/test/**,\
  services/control-plane/tests/**,\
  services/media-plane/src/config/**

# ── Coverage Exclusions (not counted toward coverage metrics) ────────────────
# Test files and helpers
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/testhelpers/**,\
  **/testdata/**,\
  **/tests/benchmarks/**,\
  **/data/emoji/**,\
  **/cmd/migrate*/**.go,\
  **/cmd/server/main.go,\
  services/media-plane/src/index.ts,\
  services/control-plane/internal/api/router.go,\
  services/control-plane/internal/database/postgres.go,\
  services/control-plane/internal/storage/client.go,\
  services/control-plane/pkg/nats/client.go,\
  client/admin/src/main.tsx,\
  services/media-plane/src/lib/logger.ts,\
  infrastructure/github/**

# ── Duplication Exclusions (not counted toward duplication metrics) ───────────
sonar.cpd.exclusions=\
  **/*_test.go,\
  **/tests/**,\
  **/email/templates/**
