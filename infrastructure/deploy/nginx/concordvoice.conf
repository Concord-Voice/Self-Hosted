# Concord Voice — subdomain-based nginx reverse proxy
# API + WS Hub:    api.concordvoice.chat   (Cloudflare-proxied)
# Media Plane:     media.concordvoice.chat (direct / DNS only)
# Backward compat: concordvoice.chat       (mirrors api subdomain)
#
# Source-of-truth: infrastructure/deploy/nginx/concordvoice.conf in repo.
# Deploy path: deploy.sh rsyncs to /opt/concord/[internal]nginx/,
# post-rsync.sh stages it into /etc/nginx/sites-available/concordvoice via
# concord-ctl.sh nginx-reload (narrow sudoers entry).
#
# Spec ref: [internal]specs/2026-05-09-919-spa-deploy-trust-chain-design.md §5.9
# Trust-model invariants 1, 3, 4 (#919 §3.3): runtime-config flows through deploy,
# not bootstrap; canonical deploy applies every source-landed change.
#
# ⚠ DO NOT EDIT /etc/nginx/sites-available/concordvoice on the server directly.
# Drift will be overwritten on the next deploy. Edit this file in repo, open a
# PR, merge to main; main-cd.yml applies the change on next push to main.

# Hide nginx version in Server header and error pages
server_tokens off;

# Validate Upgrade header — only allow "websocket" (case-insensitive).
# Rejects h2c and other smuggling vectors by mapping them to empty string.
map $http_upgrade $validated_upgrade {
    default       "";
    ~*^websocket$ websocket;
}

map $validated_upgrade $connection_upgrade {
    default "";
    websocket upgrade;
}

# Validate Host header against allowed hostnames.
# Prevents Host header injection / cache poisoning by rejecting unknown hosts.
# nosemgrep: generic.nginx.security.request-host-used.request-host-used -- $host is the discriminator KEY in a Host-allow-list map (the rule's own recommended remediation); downstream consumers use $validated_host, never $host.
map $host $validated_host {
    concordvoice.chat        concordvoice.chat;
    api.concordvoice.chat    api.concordvoice.chat;
    media.concordvoice.chat  media.concordvoice.chat;
    turn.concordvoice.chat   turn.concordvoice.chat;
    default          "";
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# Connection limiting (per-IP concurrent connections)
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Enhanced log format with timing info for monitoring
log_format timed '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time';

# Map scanner User-Agents to a flag for log routing
map $http_user_agent $is_scanner {
    default 0;
    ~*(Nmap|masscan|zgrab|nuclei|nikto|sqlmap|gobuster|dirbuster|wfuzz|hydra|OpenVAS|ZmEu|w3af|Acunetix|Nessus|WPScan) 1;
}

upstream control_plane {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream media_plane {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── Cloudflare real IP restoration ────────────────────────────────────────────
# When Cloudflare proxies traffic (api subdomain), $remote_addr is a Cloudflare
# edge IP. This restores the real client IP for rate limiting, logging, security.
# Source: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# HTTP → HTTPS redirect (certbot will also listen here for challenges)
server {
    listen 80;
    listen [::]:80;
    # turn.concordvoice.chat included so the webroot http-01 challenge for turn
    # resolves to this server block (otherwise the validated_host map miss
    # would 444 the request before /.well-known/ matches). See #881.
    server_name concordvoice.chat api.concordvoice.chat media.concordvoice.chat turn.concordvoice.chat;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$validated_host$request_uri;
    }

    # Reject requests with unknown Host headers
    if ($validated_host = "") { return 444; }
}

# HTTPS — API + WebSocket Hub (api.concordvoice.chat + bare domain backward compat)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.concordvoice.chat concordvoice.chat;

    # TLS — certbot manages these paths. The placeholder selfsigned paths are
    # rewritten to /etc/letsencrypt/live/concordvoice.chat/{fullchain,privkey}.pem
    # by provision-production.sh during initial bootstrap (one-time path swap),
    # and certbot's deploy-hook (renewal-hooks/deploy/copy-certs.sh) refreshes
    # them on each renewal. The deploy path does NOT touch these lines — TLS
    # cert lifecycle remains certbot/provision territory, not deploy territory.
    ssl_certificate     /etc/letsencrypt/live/concordvoice.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concordvoice.chat/privkey.pem;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Access logs with timing info; route scanner traffic to separate file
    access_log /var/log/nginx/scanner.log timed if=$is_scanner;
    access_log /var/log/nginx/access.log timed;

    # Request size limit (file uploads)
    client_max_body_size 10M;

    # Per-IP connection limit (mitigate slowloris / connection floods)
    limit_conn addr 50;

    # Reject requests with unknown Host headers
    if ($validated_host = "") { return 444; }

    # ─── Update asset downloads ─────────────────────────────────────
    # ^~ prefix ensures this takes priority over the extension-blocking
    # regex below (which would otherwise drop .zip requests as scanner
    # probes). electron-updater downloads binaries from this path.
    location ^~ /api/v1/updates/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── SPA asset downloads (Tier 3 hot updates) ──────────────────
    # Root-level /spa/* intentionally lives outside /api/* to escape
    # Cloudflare Free-tier JSD beacon injection on API-shaped surfaces
    # (see #725 and #750). Hashed chunk assets are cache-immutable;
    # index.html is revalidated frequently by the Go handler.
    # MUST live BEFORE the scanner-extension regex blocks below so
    # legitimate .js/.css chunks inside /spa/<sha>/assets/ are not
    # swallowed by the .env|.git|… filter. ^~ prefix match takes
    # precedence over regex matches per nginx directive ordering.
    location ^~ /spa/ {
        limit_req zone=api burst=50 nodelay;

        # ⚠ CSP inheritance break — see PR #766 §CR1 + 2026-05-09 outage retro.
        # The server-level `add_header Content-Security-Policy "default-src
        # 'none'; frame-ancestors 'none'" always` would (a) NOT be replaced by
        # any value the upstream Go SPA handler sets and (b) NOT be cleared by
        # the handler's c.Writer.Header().Del() (nginx `always` adds *after*
        # the upstream response). Browsers intersect multiple CSPs, so the
        # strict server-level policy would block every script and stylesheet
        # in the SPA. The SPA's index.html ships its own meta-tag CSP suitable
        # for serving the bundle; that meta tag is the authoritative policy
        # for SPA pages.
        #
        # nginx's `add_header` inheritance rule: if ANY add_header is set at a
        # given level, the parent-level add_headers are dropped. We redeclare
        # the other six security headers verbatim so they continue to apply,
        # and intentionally OMIT Content-Security-Policy.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Scanner / exploit path blocking ───────────────────────────
    # Drop connection immediately (444 = no response body) for common
    # vulnerability scanner paths. These never correspond to real
    # Concord API routes and are always malicious probes.

    # Block probes for config/backup/script files
    location ~* \.(env|git|aws|php|asp|aspx|jsp|cgi|sql|bak|swp|old|orig|save|conf|ini|log|sh|tar|gz|zip|rar)$ {
        access_log off;
        return 444;
    }

    # Block probes for CMS admin panels, Java frameworks, debug endpoints
    location ~* ^/(wp-|wordpress|phpmy|phpmyadmin|admin|login\.action|actuator|cgi-bin|\.vscode|\.DS_Store|xmlrpc|vendor|debug|console|manager|jmx|solr|struts) {
        access_log off;
        return 444;
    }

    # --- Socket.IO (media-plane) ---
    # The $validated_upgrade map (top-of-file) restricts Upgrade values to literal
    # "websocket" only, mapping h2c and any other vector to empty string. This IS
    # the mitigation Semgrep's possible-nginx-h2c-smuggling rule recommends; the
    # rule's pattern cannot detect the upstream filter map. Cross-reference:
    # provision-production.sh ships this same idiom in its nginx heredoc (the
    # source these blocks were unified from).
    location /socket.io/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://media_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Auth endpoints (stricter rate limit) ---
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Control plane WebSocket (voice channel signaling) ---
    # See /socket.io/ block above for the H2C-smuggling mitigation rationale.
    location /api/v1/ws {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://control_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- API routes → control plane ---
    # See /socket.io/ block above for the H2C-smuggling mitigation rationale.
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://control_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health endpoint for external monitoring ---
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Health endpoint (proxies to control-plane for stack-level verification) ---
    # nginx-health above only proves nginx itself is up; this proxies to
    # control-plane:8080/health which is what CF and external monitors hit.
    # See #848 cutover: deploy.yml's external health check fails without
    # this block because the catch-all below redirects /health.
    # Rate limit applies (#880 review): unauthenticated proxy to control-plane
    # is otherwise a cheap amplifier. burst=20 nodelay accommodates monitor
    # bursts (CF Health Check probes, deploy.yml's 18 retries) without 429s
    # for legitimate traffic at 30r/s steady-state.
    location = /health {
        limit_req zone=api burst=20 nodelay;
        access_log off;
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else → redirect to public site ---
    # concordvoice.chat is the infrastructure domain (API, WebSocket, media).
    # Browser traffic is redirected to concordvoice.com (downloads, docs, support).
    location / {
        return 301 https://concordvoice.com$request_uri;
    }
}

# HTTPS — Media Plane (media.concordvoice.chat) — DNS-only, NOT Cloudflare-proxied
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.concordvoice.chat;

    ssl_certificate     /etc/letsencrypt/live/concordvoice.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concordvoice.chat/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/media-access.log timed;
    limit_conn addr 50;

    # Reject requests with unknown Host headers
    if ($validated_host = "") { return 444; }

    # Socket.IO (media-plane signaling)
    # See api server block /socket.io/ above for H2C-smuggling mitigation rationale.
    location /socket.io/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://media_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Reject everything else
    location / {
        return 444;
    }
}
