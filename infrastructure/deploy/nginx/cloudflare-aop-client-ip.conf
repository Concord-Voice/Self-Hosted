# Inlined only into the API/apex TLS server after cloudflare-aop is selected.
# A custom AOP CA authenticates the Cloudflare zone before visitor IP recovery.
# The all-address real-IP trust is safe only with ssl_verify_client on above.
ssl_client_certificate /etc/concord/nginx/cloudflare-aop-ca.pem;
ssl_verify_client on;
ssl_verify_depth 2;
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
