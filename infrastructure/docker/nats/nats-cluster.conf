# Concord NATS server configuration with cluster routing
#
# This config enables JetStream persistence, HTTP monitoring, and cluster
# routing for multi-instance deployments.
#
# Single-instance: only the client (4222) and monitoring (8222) ports are used.
# Multi-instance: cluster routes on port 6222 enable inter-node communication.

# Client connections
port: 4222

# HTTP monitoring endpoint
http_port: 8222

# JetStream persistence
jetstream {
  store_dir: "/data/jetstream"
  max_mem: 128M
  max_file: 1G
}

# Cluster routing — inter-node communication for multi-instance deployments
# In a single-node setup, this section is harmless (no routes to connect to).
# For multi-node, add peer addresses to the routes list.
cluster {
  name: concord-cluster
  port: 6222

  # Routes to other NATS nodes in the cluster.
  # Uncomment and add addresses for multi-instance deployment:
  # routes = [
  #   nats-route://nats-2:6222
  #   nats-route://nats-3:6222
  # ]
}

# Logging
log_file: "/dev/stdout"
