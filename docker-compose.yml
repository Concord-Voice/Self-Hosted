services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: concordvoice-postgres
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concord_dev_password}
      POSTGRES_DB: concord
    # Enable WAL replication so the failover replica on port 5433 can connect.
    # These settings are lightweight and harmless when no replica is running.
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=3
        -c hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concordvoice-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: concordvoice-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-concord_dev_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-concord_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concordvoice-network

  # NATS Message Broker (for inter-service messaging)
  nats:
    image: nats:2-alpine
    container_name: concordvoice-nats
    command: "-js -m 8222"
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concordvoice-network

  # TURN/STUN Server (coturn)
  coturn:
    image: coturn/coturn:4.6.3-alpine
    container_name: concordvoice-coturn
    command: >
      turnserver
        -c /etc/coturn/turnserver.conf
        --static-auth-secret=${TURN_SECRET:-concord_dev_turn_secret}
        --realm=${TURN_REALM:-concordvoice.chat}
        --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"  # TURN relay range
    volumes:
      - ./infrastructure/docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - concordvoice-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: concordvoice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-concord}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-concord_dev_minio}
    # No host ports published in base compose — production layers on top of this file
    # and Compose merges port lists additively. Use docker-compose.override.yml for
    # dev host access, or access MinIO via `docker compose exec` / internal network.
    expose:
      - "9000"  # S3 API (internal only)
      - "9001"  # Web console (internal only)
    volumes:
      - minio-data:/data
    # No healthcheck — the MinIO image is minimal (no curl/wget/mc).
    # The control plane handles MinIO readiness via its 15s startup timeout.
    networks:
      - concordvoice-network

  # PostgreSQL Admin (optional, for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: concordvoice-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@concordvoice.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - concordvoice-network
    profiles:
      - tools

  # Redis Commander (optional, for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: concordvoice-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-concord_dev_redis}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - concordvoice-network
    profiles:
      - tools

  # Control Plane Service (Go)
  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    container_name: concordvoice-control-plane
    env_file:
      - spa.env
    environment:
      DATABASE_URL: postgres://concord:${POSTGRES_PASSWORD:-concord_dev_password}@postgres:5432/concord?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-concord_dev_redis}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      TURN_SERVER_HOST: ${TURN_SERVER_HOST:-localhost}
      TURN_SECRET: ${TURN_SECRET:-concord_dev_turn_secret}
      TURN_REALM: ${TURN_REALM:-concordvoice.chat}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@concordvoice.chat}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-http://localhost:3001}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-concord}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-concord_dev_minio}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-concord-media}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-26214400}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - concordvoice-network
    profiles:
      - services

  # Media Plane Service (Node.js + mediasoup)
  media-plane:
    build:
      context: ./services/media-plane
      dockerfile: Dockerfile
    container_name: concordvoice-media-plane
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      REDIS_URL: redis://:${REDIS_PASSWORD:-concord_dev_redis}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 49999
      ANNOUNCED_IP: 127.0.0.1
      PORT: 3000
    ports:
      - "3000:3000"
      - "40000-40099:40000-40099/udp"  # RTC ports (limited range for dev)
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      control-plane:
        condition: service_started
    networks:
      - concordvoice-network
    profiles:
      - services

  # Licensing Authority Service (Go)
  licensing-authority:
    build:
      context: ./services/licensing-authority
      dockerfile: Dockerfile
    container_name: concordvoice-licensing-authority
    environment:
      DATABASE_URL: postgres://concord:${POSTGRES_PASSWORD:-concord_dev_password}@postgres:5432/concord?sslmode=disable
      PRIVATE_KEY_PATH: /app/keys/license_private_key.pem
      PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/licensing/keys:/app/keys
    networks:
      - concordvoice-network
    profiles:
      - licensing

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  concordvoice-network:
    driver: bridge
