version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - ineffassign
    - misspell
    - unconvert
    - nakedret
    - prealloc
    - revive
    - nilerr
    - asciicheck
    - bidichk
    - durationcheck

  settings:
    gosec:
      excludes:
        - G701

run:
  # 10m: a cold Go build cache on GitHub's 4 vCPU runner exceeded 5m loading
  # packages (PR #38); warm runs finish in about a minute.
  timeout: 10m
