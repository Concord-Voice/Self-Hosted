<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Account Recovery</title></head>
<body style="margin:0;padding:0;background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;padding:40px 0">
<tr><td align="center">
  <table role="presentation" cellpadding="0" cellspacing="0" style="width:480px;background:#16213e;border-radius:12px;padding:40px">
  <tr><td align="center" style="padding-bottom:24px">
    <h1 style="color:#e2e8f0;font-size:24px;margin:0">Concord</h1>
  </td></tr>
  <tr><td align="center" style="padding-bottom:16px">
    <p style="color:#a0aec0;font-size:16px;margin:0">Enter this code to recover your account:</p>
  </td></tr>
  <tr><td align="center" style="padding-bottom:24px">
    <div style="background:#0f3460;border-radius:8px;padding:16px 32px;display:inline-block;letter-spacing:8px;font-size:32px;font-weight:700;color:#e2e8f0;font-family:monospace">{{.Code}}</div>
  </td></tr>
  <tr><td align="center">
    <p style="color:#718096;font-size:14px;margin:0">This code expires in 10 minutes. If you didn't request account recovery, someone may be trying to access your account — you can safely ignore this email.</p>
  </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
