openapi: 3.0.3
info:
  title: Concord Control Plane API
  description: |
    REST API for the Concord real-time communications platform.

    ## Authentication
    Most endpoints require a JWT access token passed via the `Authorization: Bearer <token>` header.
    Tokens are obtained via `/auth/login` or `/auth/register` and expire after 15 minutes.
    Use `/auth/refresh` with the HttpOnly refresh token cookie to obtain a new access token.

    ## Conventions
    - All IDs are UUIDs (v4)
    - All timestamps are ISO 8601 with timezone (TIMESTAMPTZ)
    - Error responses use `{"error": "message"}` format
    - Rate limits are documented per-endpoint; exceeded limits return 429

    ## End-to-End Encryption (E2EE)
    Channels can be encrypted using AES-256-GCM with per-channel symmetric keys (CSK).
    CSKs are wrapped per-member using RSA-OAEP 4096-bit public keys.
    The server never has access to plaintext messages or unwrapped keys.

    ## WebSocket
    Real-time messaging uses a WebSocket connection at `/api/v1/ws`.
    See the WebSocket tag for protocol details.
  version: 1.0.0
  contact:
    name: Concord
    url: https://github.com/markdrogersjr/Concord
  license:
    name: CVSL 1.0
    url: https://github.com/markdrogersjr/Concord/blob/main/LICENSE

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.concordvoice.chat/api/v1
    description: Production

tags:
  - name: Auth
    description: Registration, login, token management, logout
  - name: Users
    description: User profile, E2EE keys, preferences
  - name: Sessions
    description: Session listing and revocation
  - name: Servers
    description: Server CRUD and management
  - name: Channels
    description: Channel CRUD, read states, encryption keys
  - name: Messages
    description: Send, edit, delete messages
  - name: Members
    description: Server membership management
  - name: Invites
    description: Server invite codes and joining
  - name: E2EE
    description: End-to-end encryption key management
  - name: Voice
    description: Voice channel participation and signaling
  - name: DM
    description: Direct messages, group DMs, and DM voice calls
  - name: Friends
    description: Friend requests, friend list, blocking
  - name: FriendCodes
    description: Shareable friend codes for easy connections
  - name: Privacy
    description: User privacy settings
  - name: ChannelGroups
    description: Channel grouping and reordering within servers
  - name: WebSocket
    description: Real-time WebSocket protocol

# ============================================================
# PATHS
# ============================================================
paths:

  # ----------------------------------------------------------
  # AUTH
  # ----------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Create a new user account with E2EE key material.
        Rate limit: 5 requests per 15 minutes (IP-based).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 900
                  remember_me:
                    type: boolean
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      username:
                        type: string
                      e2ee_preference:
                        type: boolean
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Authenticate with email and password. Returns access token, user profile, and E2EE keys.
        Rate limit: 10 requests per 15 minutes (IP-based).
        Account locks after 5 failed attempts (escalating: 15m, 30m, 60m).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 900
                  remember_me:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
                  e2ee_keys:
                    $ref: '#/components/schemas/E2EEKeys'
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Account locked due to too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Exchange the HttpOnly refresh token cookie for a new access token.
        Implements single-use rotation with breach detection.
        Rate limit: 30 requests per minute (IP-based).
      security:
        - CookieAuth: []
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 900
          headers:
            Set-Cookie:
              description: New HttpOnly refresh token cookie (rotation)
              schema:
                type: string
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: |
        Invalidate the current session. Blacklists the access token in Redis.
        Rate limit: 10 requests per minute (IP-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/ws-ticket:
    post:
      tags: [Auth]
      summary: Issue a WebSocket ticket
      description: |
        Generate a short-lived, single-use ticket for WebSocket authentication.
        The ticket is valid for 30 seconds and can only be used once.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                    description: Single-use ticket (30s TTL)
        '429':
          $ref: '#/components/responses/RateLimited'

  # ----------------------------------------------------------
  # USERS
  # ----------------------------------------------------------
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: 'Rate limit: 30 requests per minute.'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: Update current user profile
      description: |
        Update profile fields. All fields are optional.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/keys:
    get:
      tags: [Users]
      summary: Get E2EE keys
      description: |
        Retrieve wrapped private key and derivation salt for the current user.
        Used during password change to re-wrap keys.
        Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: E2EE key material
          content:
            application/json:
              schema:
                type: object
                properties:
                  e2ee_keys:
                    $ref: '#/components/schemas/E2EEKeys'
    put:
      tags: [Users]
      summary: Replace E2EE keys
      description: |
        Replace wrapped private key and salt (for key recovery).
        Rate limit: 3 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceKeysRequest'
      responses:
        '200':
          description: Keys replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/me/password:
    post:
      tags: [Users]
      summary: Change password
      description: |
        Change password and re-wrap E2EE private key atomically.
        Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{user_id}/public-key:
    get:
      tags: [Users]
      summary: Get user's public key
      description: |
        Retrieve a user's RSA public key for E2EE key wrapping.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  public_key:
                    type: string
                    description: Base64-encoded SPKI public key
                  key_version:
                    type: integer
        '404':
          description: User or public key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/preferences:
    get:
      tags: [Users]
      summary: Get user preferences
      description: |
        Retrieve client-encrypted preferences blob for cross-device sync.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Preferences (null if not set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    nullable: true
                    type: object
                    properties:
                      encrypted_data:
                        type: string
                        description: Base64-encoded AES-256-GCM ciphertext
                      version:
                        type: integer
                      updated_at:
                        type: string
                        format: date-time
    put:
      tags: [Users]
      summary: Update user preferences
      description: |
        Store client-encrypted preferences blob (max 64KB).
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Preferences saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer

  # ----------------------------------------------------------
  # SESSIONS
  # ----------------------------------------------------------
  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      description: |
        List active and past sessions for the current user.
        IP addresses are masked for privacy.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  past_sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PastSession'
                  total:
                    type: integer
    delete:
      tags: [Sessions]
      summary: Revoke all sessions
      description: |
        Revoke all sessions except the current one (default).
        Pass `?include_current=true` to also revoke the current session.
        Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - name: include_current
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  include_current:
                    type: boolean

  /sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke a specific session
      description: 'Rate limit: 10 requests per minute.'
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session_id:
                    type: string
                    format: uuid
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # SERVERS
  # ----------------------------------------------------------
  /servers:
    get:
      tags: [Servers]
      summary: List user's servers
      description: |
        List all servers the current user is a member of, including role and member counts.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Server list
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerWithRole'
    post:
      tags: [Servers]
      summary: Create a server
      description: |
        Create a new server. The creator becomes the owner.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Server created
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/Server'
                  role:
                    type: string
                    example: owner
        '400':
          $ref: '#/components/responses/BadRequest'

  /servers/unread-status:
    get:
      tags: [Servers]
      summary: Get unread status across all servers
      description: |
        Returns a list of server IDs that have unread messages.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Server IDs with unread messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_ids:
                    type: array
                    items:
                      type: string
                      format: uuid

  /servers/{id}:
    get:
      tags: [Servers]
      summary: Get a server
      description: |
        Get server details including the current user's role.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/Server'
                  role:
                    type: string
                    enum: [owner, admin, member]
        '403':
          description: Not a member of this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Servers]
      summary: Update a server
      description: |
        Update server name and icon. Requires owner or admin role.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Server updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/Server'
                  role:
                    type: string
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Servers]
      summary: Delete a server
      description: |
        Permanently delete a server. Owner only.
        Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Server deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          description: Only the server owner can delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # SERVER SUB-RESOURCES
  # ----------------------------------------------------------
  /servers/{id}/channels:
    get:
      tags: [Channels]
      summary: List channels in a server
      description: 'Rate limit: 30 requests per minute.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Channel list
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'

  /servers/{id}/members:
    get:
      tags: [Members]
      summary: List server members
      description: 'Rate limit: 30 requests per minute.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberWithUser'
    post:
      tags: [Members]
      summary: Add a member to a server
      description: |
        Add a user to the server. Requires owner or admin role.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/ServerMember'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User is already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /servers/{id}/members/{user_id}:
    patch:
      tags: [Members]
      summary: Update member role
      description: |
        Change a member's role. Owner only.
        Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/ServerMember'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Members]
      summary: Remove a member
      description: |
        Remove a member from the server (kick) or leave the server (self).
        Owner/admin can kick members; any member can leave.
        Owners cannot leave their own server.
        Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed or left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          description: Insufficient permissions or owner cannot leave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /servers/{id}/invites:
    get:
      tags: [Invites]
      summary: List server invites
      description: |
        List all invites for a server. Owner/admin only.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Invite list
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerInviteWithCreator'
    post:
      tags: [Invites]
      summary: Create an invite code
      description: |
        Generate a new invite code for the server. Owner/admin only.
        Defaults: max_uses=1, expires_in=86400 (24h).
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    $ref: '#/components/schemas/ServerInvite'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /servers/{id}/invites/{invite_id}:
    delete:
      tags: [Invites]
      summary: Revoke an invite
      description: |
        Revoke a server invite code. Owner/admin only.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invite revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /servers/{id}/unread:
    get:
      tags: [Channels]
      summary: Get unread counts per channel
      description: |
        Get unread message counts for all channels in a server.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Unread counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreads:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelUnreadCount'

  /servers/{id}/read:
    post:
      tags: [Channels]
      summary: Mark all channels as read
      description: |
        Mark all channels in a server as read.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: All channels marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  # ----------------------------------------------------------
  # CHANNELS
  # ----------------------------------------------------------
  /channels:
    post:
      tags: [Channels]
      summary: Create a channel
      description: |
        Create a channel in a server. Requires owner or admin role.
        For encrypted channels, provide wrapped_keys mapping user IDs to wrapped CSKs.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /channels/{id}:
    get:
      tags: [Channels]
      summary: Get a channel
      description: 'Rate limit: 30 requests per minute.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel details
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    $ref: '#/components/schemas/Channel'
    patch:
      tags: [Channels]
      summary: Update a channel
      description: |
        Update channel name, type, and emoji. Encryption status cannot be changed.
        Requires owner or admin role.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Channel updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    $ref: '#/components/schemas/Channel'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Channels]
      summary: Delete a channel
      description: |
        Permanently delete a channel. Requires owner or admin role.
        Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /channels/{id}/messages:
    get:
      tags: [Messages]
      summary: Get message history
      description: |
        Retrieve messages for a channel with cursor-based pagination.
        Messages are returned newest-first.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          description: Message UUID for cursor pagination (get messages before this ID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageWithUser'
                  count:
                    type: integer

  /channels/{id}/read:
    post:
      tags: [Channels]
      summary: Mark channel as read
      description: 'Rate limit: 30 requests per minute.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /channels/{id}/keys:
    get:
      tags: [E2EE]
      summary: Get channel encryption key
      description: |
        Get the caller's wrapped channel symmetric key (CSK) for an encrypted channel.
        Returns 404 with `pending: true` if the key has not yet been distributed.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/ChannelKey'
        '404':
          description: Key not yet distributed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No encryption key available yet
                  pending:
                    type: boolean
                    example: true
    post:
      tags: [E2EE]
      summary: Distribute channel keys
      description: |
        Distribute wrapped CSKs to new members. The caller must already have a key for this channel.
        First-response-wins on duplicates.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributeKeysRequest'
      responses:
        '200':
          description: Keys distributed
          content:
            application/json:
              schema:
                type: object
                properties:
                  distributed:
                    type: integer
                  duplicates:
                    type: integer

  # ----------------------------------------------------------
  # E2EE
  # ----------------------------------------------------------
  /e2ee/pending-keys:
    get:
      tags: [E2EE]
      summary: Get pending key requests
      description: |
        List channels where the current user needs to distribute keys to new members.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending key requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingKeyRequest'

  # ----------------------------------------------------------
  # MESSAGES
  # ----------------------------------------------------------
  /messages:
    post:
      tags: [Messages]
      summary: Send a message
      description: |
        Send a message to a channel. For encrypted channels, content must be
        base64-encoded AES-256-GCM ciphertext and is_encrypted must be true.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '400':
          description: Validation error or E2EE enforcement failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of the channel's server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{id}:
    patch:
      tags: [Messages]
      summary: Edit a message
      description: |
        Edit a message. Only the author can edit.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
      responses:
        '200':
          description: Message updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '403':
          description: Not the message author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Messages]
      summary: Delete a message
      description: |
        Delete a message. Author, server owner, or admin can delete.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # INVITES
  # ----------------------------------------------------------
  /invites/join:
    post:
      tags: [Invites]
      summary: Join a server via invite code
      description: |
        Join a server using an 8-character invite code.
        Creates pending key requests for E2EE channels.
        Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  description: 8-character invite code
      responses:
        '200':
          description: Joined server
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/Server'
                  role:
                    type: string
                    example: member
        '400':
          description: Invalid, expired, or used-up invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invites/{code}:
    get:
      tags: [Invites]
      summary: Preview an invite
      description: |
        Get server info for an invite code without joining.
        Rate limit: 30 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite info
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_name:
                    type: string
                  server_icon:
                    type: string
                    nullable: true
                  member_count:
                    type: integer
                  valid:
                    type: boolean
        '404':
          description: Invalid invite code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # VOICE (Phase 1C)
  # ----------------------------------------------------------
  /channels/{id}/voice/participants:
    get:
      tags: [Voice]
      summary: List voice channel participants
      description: |
        Get the list of users currently connected to this voice channel.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Participants list
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoiceParticipant'
        '403':
          description: Not a member of this channel's server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /channels/{id}/voice/join:
    post:
      tags: [Voice]
      summary: Join a voice channel
      description: |
        Request permission to join a voice channel and receive media server
        connection details including ICE servers for NAT traversal.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Join approved with connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceJoinResponse'
        '403':
          description: Not a member of this channel's server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /channels/{id}/rotate-key:
    post:
      tags: [E2EE]
      summary: Rotate channel encryption key
      description: |
        Initiate a key rotation for an encrypted channel. Increments the
        key version; members must re-distribute wrapped keys.
        Rate limit: 10 requests per 24 hours (per channel, Redis INCR+EXPIRE).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Key rotation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Key rotation initiated
                  new_key_version:
                    type: integer
        '403':
          description: Not authorized (must be server owner or admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ----------------------------------------------------------
  # CHANNEL GROUPS (Phase 1C)
  # ----------------------------------------------------------
  /servers/{id}/channel-groups:
    get:
      tags: [ChannelGroups]
      summary: List channel groups
      description: |
        Get all channel groups for a server, ordered by position.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Channel groups list
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelGroup'
    post:
      tags: [ChannelGroups]
      summary: Create a channel group
      description: |
        Create a new channel group in a server. Requires owner or admin role.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
      responses:
        '201':
          description: Channel group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelGroup'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /servers/{id}/channel-groups/{group_id}:
    patch:
      tags: [ChannelGroups]
      summary: Update a channel group
      description: |
        Rename a channel group. Requires owner or admin role.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
      responses:
        '200':
          description: Channel group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelGroup'
    delete:
      tags: [ChannelGroups]
      summary: Delete a channel group
      description: |
        Delete a channel group. Channels in the group become ungrouped.
        Requires owner or admin role. Rate limit: 5 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Channel group deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /servers/{id}/channels/reorder:
    put:
      tags: [ChannelGroups]
      summary: Reorder channels
      description: |
        Batch-update channel positions and group assignments within a server.
        Requires owner or admin role. Rate limit: 10 requests per minute.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    type: object
                    required: [id, position]
                    properties:
                      id:
                        type: string
                        format: uuid
                      position:
                        type: integer
                      group_id:
                        type: string
                        format: uuid
                        nullable: true
      responses:
        '200':
          description: Channels reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  # ----------------------------------------------------------
  # DM (Phase 1C)
  # ----------------------------------------------------------
  /dm/conversations:
    get:
      tags: [DM]
      summary: List DM conversations
      description: |
        Get all DM conversations for the authenticated user, including
        last message preview and unread count.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/DMConversation'
    post:
      tags: [DM]
      summary: Open a 1-on-1 DM conversation
      description: |
        Open or get an existing 1-on-1 DM conversation with another user.
        Returns 200 if conversation already exists, 201 if newly created.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Existing conversation returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
        '201':
          description: New conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'

  /dm/conversations/group:
    post:
      tags: [DM]
      summary: Create a group DM
      description: |
        Create a group DM conversation with 2-10 participants (including yourself).
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 9
                name:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Group DM created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'

  /dm/conversations/personal:
    post:
      tags: [DM]
      summary: Create a personal notes conversation
      description: |
        Create or get a personal notes conversation (DM with yourself).
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Existing personal conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
        '201':
          description: New personal conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'

  /dm/conversations/{id}:
    get:
      tags: [DM]
      summary: Get a DM conversation
      description: |
        Get details of a specific DM conversation.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
        '403':
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [DM]
      summary: Update a DM conversation
      description: |
        Update conversation settings (e.g., group name).
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Conversation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /dm/conversations/{id}/messages:
    get:
      tags: [DM]
      summary: Get DM message history
      description: |
        Get messages in a DM conversation with cursor-based pagination.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Cursor — message ID to fetch messages before
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/DMMessage'

  /dm/conversations/{id}/read:
    post:
      tags: [DM]
      summary: Mark DM conversation as read
      description: |
        Mark all messages in a DM conversation as read.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /dm/conversations/{id}/keys:
    get:
      tags: [DM]
      summary: Get DM encryption key
      description: |
        Get the wrapped E2EE key for a DM conversation.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Wrapped key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/DMKey'
    post:
      tags: [DM]
      summary: Distribute DM encryption keys
      description: |
        Distribute wrapped E2EE keys to DM conversation participants.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrapped_keys]
              properties:
                wrapped_keys:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of user_id → base64-encoded wrapped key
                key_version:
                  type: integer
      responses:
        '200':
          description: Keys distributed
          content:
            application/json:
              schema:
                type: object
                properties:
                  distributed:
                    type: integer

  /dm/conversations/{id}/voice/join:
    post:
      tags: [DM, Voice]
      summary: Join DM voice call
      description: |
        Join a voice call in a DM conversation.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Voice call joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMVoiceJoinResponse'

  /dm/conversations/{id}/voice/participants:
    get:
      tags: [DM, Voice]
      summary: List DM voice call participants
      description: |
        Get participants currently in a DM voice call.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Participants list
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoiceParticipant'

  /dm/conversations/{id}/rotate-key:
    post:
      tags: [DM, E2EE]
      summary: Rotate DM encryption key
      description: |
        Initiate key rotation for an encrypted DM conversation.
        Rate limit: 10 requests per 24 hours (per conversation, Redis INCR+EXPIRE).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key rotation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Key rotation initiated
                  new_key_version:
                    type: integer
        '429':
          $ref: '#/components/responses/RateLimited'

  # ----------------------------------------------------------
  # FRIENDS (Phase 1C)
  # ----------------------------------------------------------
  /friends:
    get:
      tags: [Friends]
      summary: List friends
      description: |
        Get the authenticated user's friend list.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Friends list
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      $ref: '#/components/schemas/Friend'

  /friends/requests:
    get:
      tags: [Friends]
      summary: List friend requests
      description: |
        Get all pending friend requests (sent and received).
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Friend requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/FriendRequest'

  /friends/request:
    post:
      tags: [Friends]
      summary: Send a friend request
      description: |
        Send a friend request by user ID or username. Exactly one of
        `user_id` or `username` must be provided.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                  nullable: true
                username:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Friend request sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid request (cannot befriend self, already friends, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /friends/request/{id}:
    patch:
      tags: [Friends]
      summary: Accept or decline a friend request
      description: |
        Respond to a pending friend request.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Friend request UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, decline]
      responses:
        '200':
          description: Request accepted or declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /friends/{user_id}:
    delete:
      tags: [Friends]
      summary: Remove a friend
      description: |
        Remove a user from your friend list.
        Rate limit: 5 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Friend removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /friends/{user_id}/block:
    post:
      tags: [Friends]
      summary: Block a user
      description: |
        Block a user. Removes any existing friendship and prevents future requests.
        Rate limit: 5 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  # ----------------------------------------------------------
  # FRIEND CODES (Phase 1C)
  # ----------------------------------------------------------
  /friends/codes:
    post:
      tags: [FriendCodes]
      summary: Create a friend code
      description: |
        Generate a shareable 8-character friend code with optional expiry and use limits.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 10
                  nullable: true
                  description: Max redemptions (default 1)
                expires_in:
                  type: integer
                  minimum: 300
                  maximum: 86400
                  nullable: true
                  description: Seconds until expiry (default 3600)
                auto_accept:
                  type: boolean
                  description: Auto-accept without confirmation (default false)
      responses:
        '201':
          description: Friend code created
          content:
            application/json:
              schema:
                type: object
                properties:
                  friend_code:
                    $ref: '#/components/schemas/FriendCode'
    get:
      tags: [FriendCodes]
      summary: List your friend codes
      description: |
        Get all friend codes created by the authenticated user.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Friend codes list
          content:
            application/json:
              schema:
                type: object
                properties:
                  friend_codes:
                    type: array
                    items:
                      $ref: '#/components/schemas/FriendCode'

  /friends/codes/{id}:
    delete:
      tags: [FriendCodes]
      summary: Revoke a friend code
      description: |
        Revoke a friend code so it can no longer be used.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Friend code UUID
      responses:
        '200':
          description: Friend code revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /friends/codes/{code}/lookup:
    get:
      tags: [FriendCodes]
      summary: Look up a friend code
      description: |
        Preview who a friend code belongs to before claiming it.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: 8-character friend code
      responses:
        '200':
          description: Friend code owner info
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  display_name:
                    type: string
                    nullable: true
                  avatar_url:
                    type: string
                    nullable: true
                  valid:
                    type: boolean
        '404':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /friends/codes/{code}/claim:
    post:
      tags: [FriendCodes]
      summary: Claim a friend code
      description: |
        Redeem a friend code to send (or auto-accept) a friend request.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: 8-character friend code
      responses:
        '200':
          description: Friend code claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, accepted]
                  friendship_id:
                    type: string
                    format: uuid
                  user:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      username:
                        type: string
                      display_name:
                        type: string
                        nullable: true
                      avatar_url:
                        type: string
                        nullable: true

  # ----------------------------------------------------------
  # PRIVACY (Phase 1C)
  # ----------------------------------------------------------
  /users/me/privacy:
    get:
      tags: [Privacy]
      summary: Get privacy settings
      description: |
        Get the authenticated user's privacy settings.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  privacy:
                    $ref: '#/components/schemas/PrivacySettings'
    patch:
      tags: [Privacy]
      summary: Update privacy settings
      description: |
        Update one or more privacy settings. Only provided fields are changed.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettings'
      responses:
        '200':
          description: Updated privacy settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  privacy:
                    $ref: '#/components/schemas/PrivacySettings'

  # ----------------------------------------------------------
  # USER SEARCH & PROFILE (Phase 1C)
  # ----------------------------------------------------------
  /users/search:
    get:
      tags: [Users]
      summary: Search users by username
      description: |
        Search for users by username prefix. Minimum 2 characters required.
        Results are filtered by the target user's privacy settings.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Username search query
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        username:
                          type: string
                        display_name:
                          type: string
                          nullable: true
                        avatar_url:
                          type: string
                          nullable: true

  /users/{user_id}/profile:
    get:
      tags: [Users]
      summary: Get a user's public profile
      description: |
        Get another user's public profile including bio, links, and avatar.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # E2EE UNIFIED (Phase 1C)
  # ----------------------------------------------------------
  /e2ee/validate-epochs:
    post:
      tags: [E2EE]
      summary: Validate key epochs
      description: |
        Validate that the client's key versions (epochs) for channels and DMs
        are current. Returns validity status and any revocations.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [epochs]
              properties:
                epochs:
                  type: object
                  additionalProperties:
                    type: integer
                  description: Map of context_id → key_version
      responses:
        '200':
          description: Epoch validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: object
                    additionalProperties:
                      type: boolean
                    description: Map of context_id → is_valid
                  revocations:
                    type: array
                    items:
                      type: object
                      properties:
                        context_id:
                          type: string
                          format: uuid
                        revoked_epoch:
                          type: integer
                        successor_epoch:
                          type: integer

  /e2ee/keys/{context_id}:
    get:
      tags: [E2EE]
      summary: Get wrapped key for a context
      description: |
        Get the wrapped E2EE key for a channel or DM conversation.
        Rate limit: 30 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Channel or DM conversation UUID
      responses:
        '200':
          description: Wrapped key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      context_id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      wrapped_key:
                        type: string
                        description: Base64-encoded RSA-OAEP wrapped key
                      key_version:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
        '404':
          description: No key found for this context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [E2EE]
      summary: Distribute keys for a context
      description: |
        Distribute wrapped E2EE keys to members of a channel or DM conversation.
        Rate limit: 10 requests per minute (user-based).
      security:
        - BearerAuth: []
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrapped_keys]
              properties:
                wrapped_keys:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of user_id → base64-encoded wrapped key
                key_version:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Keys distributed
          content:
            application/json:
              schema:
                type: object
                properties:
                  distributed:
                    type: integer

  # ----------------------------------------------------------
  # SESSIONS — additional (Phase 1C)
  # ----------------------------------------------------------
  /sessions/revoke-all:
    post:
      tags: [Sessions]
      summary: Revoke all sessions
      description: |
        Revoke all active sessions for the authenticated user, including the current one.
        Rate limit: 5 requests per minute (user-based).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /sessions/revocation-mode:
    put:
      tags: [Sessions]
      summary: Set session revocation mode
      description: |
        Enable or disable session revocation mode. When enabled, all new sessions
        are immediately revoked (useful for compromised accounts).
        Rate limit: 5 requests per minute (user-based).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Revocation mode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  enabled:
                    type: boolean

  # ----------------------------------------------------------
  # WEBSOCKET
  # ----------------------------------------------------------
  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket connection
      description: |
        Upgrade to a WebSocket connection for real-time messaging.

        ## Authentication
        Use one of:
        - `?ticket=<ticket>` — Preferred. Get a ticket from `POST /auth/ws-ticket`.
        - `?token=<jwt>` — JWT access token as query parameter.
        - `Authorization: Bearer <jwt>` — JWT in header (before upgrade).

        ## Connection Lifecycle
        - Server sends `connected` message with `client_id` and `user_id`
        - Server sends `presence_snapshot` with all online users
        - Client subscribes to channels/servers
        - Ping/pong: 54s ping interval, 60s pong timeout
        - Max message size: 512KB

        ## Rate Limiting
        Token bucket: 10 message burst, 5 messages/second sustained.

        ## Client → Server Messages

        | Type | Fields | Description |
        |------|--------|-------------|
        | `subscribe` | `channel_id` | Subscribe to channel messages (verifies membership) |
        | `unsubscribe` | `channel_id` | Unsubscribe from channel |
        | `subscribe_server` | `server_id` | Subscribe to server-level events |
        | `unsubscribe_server` | `server_id` | Unsubscribe from server |
        | `message` | `channel_id`, `content`, `is_encrypted`, `nonce` | Send message (persisted to DB) |
        | `typing` | `channel_id`, `is_typing` | Typing indicator |
        | `heartbeat` | — | Refresh presence TTL |
        | `set_status` | `status` (online/dnd/invisible) | Set user status |

        ## Server → Client Messages

        | Type | Fields | Description |
        |------|--------|-------------|
        | `connected` | `client_id`, `user_id` | Connection established |
        | `presence_snapshot` | `users[]` | All online users with statuses |
        | `subscribed` | `channel_id` | Channel subscription confirmed |
        | `message` | `id`, `channel_id`, `user_id`, `username`, `display_name`, `avatar_url`, `content`, `is_encrypted`, `created_at` | New message |
        | `message_ack` | `nonce`, `id`, `channel_id`, `created_at` | Message persisted (sent to author) |
        | `message_update` | `id`, `channel_id`, `content`, `edited_at` | Message edited |
        | `message_delete` | `id`, `channel_id` | Message deleted |
        | `typing` | `channel_id`, `user_id`, `username`, `is_typing` | Typing indicator |
        | `presence` | `user_id`, `status`, `timestamp` | User status change |
        | `server_online_counts` | `counts` (server_id → count) | Updated online counts |
        | `unread_notify` | `channel_id`, `server_id` | Unread notification |
        | `profile_updated` | `user_id`, `username`, `display_name`, `avatar_url` | Profile changed |
        | `preferences_updated` | `version` | Preferences sync trigger |
        | `server_updated` | `server_id`, `name`, `icon_url` | Server modified |
        | `server_deleted` | `server_id` | Server deleted |
        | `channel_created` | channel fields | New channel |
        | `channel_updated` | `channel_id`, `server_id`, `name`, `type`, `emoji`, `is_encrypted` | Channel modified |
        | `channel_deleted` | `channel_id`, `server_id` | Channel deleted |
        | `member_joined` | `server_id`, `user_id`, `username`, `display_name`, `avatar_url`, `role` | New member |
        | `member_removed` | `server_id`, `user_id` | Member left/kicked |
        | `key_delivered` | `channel_id`, `user_id` | E2EE key now available |
        | `key_needed` | `server_id`, `user_id`, `channel_ids[]` | Key distribution needed |
        | `error` | `message` | Error |
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)

# ============================================================
# COMPONENTS
# ============================================================
components:

  # ----------------------------------------------------------
  # SECURITY SCHEMES
  # ----------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15-minute expiry)
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie (30-day expiry)

  # ----------------------------------------------------------
  # PARAMETERS
  # ----------------------------------------------------------
  parameters:
    ServerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Server UUID
    ChannelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Channel UUID

  # ----------------------------------------------------------
  # RESPONSES
  # ----------------------------------------------------------
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests — rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the rate limit window resets
          schema:
            type: integer
            example: 3600
        X-RateLimit-Limit:
          description: Maximum requests allowed in the window
          schema:
            type: integer
            example: 10
        X-RateLimit-Remaining:
          description: Requests remaining (always 0 when 429 is returned)
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          description: Unix timestamp when the rate limit window resets
          schema:
            type: integer
            example: 1744329600
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'

  # ----------------------------------------------------------
  # SCHEMAS
  # ----------------------------------------------------------
  schemas:

    # Common
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RateLimitError:
      type: object
      properties:
        error:
          type: string
          example: Rate limit exceeded
        message:
          type: string
          example: Key rotation limit reached. Try again in 23 hours 59 minutes.
        retry_after:
          type: integer
          description: Seconds until the rate limit window resets
          example: 86340
      required: [error, message]

    SuccessMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # Auth Requests
    RegisterRequest:
      type: object
      required: [email, username, password, age_confirmation, public_key, wrapped_private_key, key_derivation_salt]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 12
          description: Must include uppercase, lowercase, digit, and special character
        age_confirmation:
          type: boolean
          description: Must be true (user confirms they are 16+)
        public_key:
          type: string
          description: Base64-encoded SPKI RSA-4096 public key
        wrapped_private_key:
          type: string
          description: Base64-encoded AES-GCM encrypted private key
        key_derivation_salt:
          type: string
          description: Base64-encoded 16-byte PBKDF2 salt
        e2ee_preference:
          type: boolean
          default: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        remember_me:
          type: boolean
          description: 'Default: true. When false, session uses browser-session cookie.'

    # User Requests
    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        display_name:
          type: string
          maxLength: 100
          nullable: true
          description: Set to null to clear
        bio:
          type: string
          maxLength: 500
          nullable: true
        avatar_url:
          type: string
          nullable: true
          description: Data URL (max 500KB) or null to remove
        links:
          type: array
          items:
            type: string
          maxItems: 5
          description: HTTP(S) URLs, max 500 chars each

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, wrapped_private_key, key_derivation_salt]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12
        wrapped_private_key:
          type: string
          description: Re-wrapped with new PBKDF2-derived key
        key_derivation_salt:
          type: string
          description: New salt for PBKDF2 derivation

    ReplaceKeysRequest:
      type: object
      required: [wrapped_private_key, key_derivation_salt]
      properties:
        wrapped_private_key:
          type: string
        key_derivation_salt:
          type: string

    UpdatePreferencesRequest:
      type: object
      required: [encrypted_data]
      properties:
        encrypted_data:
          type: string
          maxLength: 65536
          description: Base64-encoded AES-256-GCM encrypted preferences blob

    # Server Requests
    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        icon_url:
          type: string
          nullable: true
          description: Data URL (max 500KB)
        e2ee_default:
          type: boolean
          default: true
          description: Whether new channels are encrypted by default

    UpdateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        icon_url:
          type: string
          nullable: true
          description: Data URL or null to remove

    # Channel Requests
    CreateChannelRequest:
      type: object
      required: [server_id, name, type]
      properties:
        server_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 100
        type:
          type: string
          enum: [text, voice, bulletin]
        emoji:
          type: string
          nullable: true
        is_encrypted:
          type: boolean
          description: Defaults to the server's e2ee_default
        wrapped_keys:
          type: object
          additionalProperties:
            type: string
          description: 'Required if encrypted. Map of user_id → base64 wrapped CSK.'

    UpdateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        type:
          type: string
          enum: [text, voice, bulletin]
        emoji:
          type: string
          nullable: true

    DistributeKeysRequest:
      type: object
      required: [wrapped_keys]
      properties:
        wrapped_keys:
          type: object
          additionalProperties:
            type: string
          description: 'Map of user_id → base64 wrapped CSK'

    # Message Requests
    SendMessageRequest:
      type: object
      required: [channel_id, content]
      properties:
        channel_id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 24000
          description: Plaintext or base64-encoded AES-256-GCM ciphertext
        is_encrypted:
          type: boolean
          default: false

    UpdateMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 24000

    # Member Requests
    AddMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]

    # Invite Requests
    CreateInviteRequest:
      type: object
      properties:
        max_uses:
          type: integer
          minimum: 0
          maximum: 100
          default: 1
          description: '0 = unlimited'
        expires_in:
          type: integer
          minimum: 300
          maximum: 604800
          default: 86400
          description: Seconds until expiry (5min to 7d, default 24h)

    # Response Models
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        display_name:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        links:
          type: array
          items:
            type: string
        email_verified:
          type: boolean
        age_verified:
          type: boolean
        e2ee_preference:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    E2EEKeys:
      type: object
      properties:
        wrapped_private_key:
          type: string
          description: Base64-encoded AES-GCM encrypted RSA private key
        key_derivation_salt:
          type: string
          description: Base64-encoded PBKDF2 salt
        key_version:
          type: integer

    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon_url:
          type: string
          nullable: true
        owner_id:
          type: string
          format: uuid
        e2ee_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServerWithRole:
      allOf:
        - $ref: '#/components/schemas/Server'
        - type: object
          properties:
            role:
              type: string
              enum: [owner, admin, member]
            member_count:
              type: integer
            online_count:
              type: integer

    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [text, voice, bulletin]
        description:
          type: string
          nullable: true
        emoji:
          type: string
          nullable: true
        is_encrypted:
          type: boolean
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        is_encrypted:
          type: boolean
        edited_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MessageWithUser:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          properties:
            username:
              type: string
            display_name:
              type: string
              nullable: true
            avatar_url:
              type: string
              nullable: true

    ServerMember:
      type: object
      properties:
        server_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time

    MemberWithUser:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time
        last_seen:
          type: integer
          format: int64
          nullable: true
          description: Unix timestamp of last activity

    ServerInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        code:
          type: string
          description: 8-character invite code
        created_by:
          type: string
          format: uuid
        max_uses:
          type: integer
          nullable: true
        use_count:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_revoked:
          type: boolean
        created_at:
          type: string
          format: date-time

    ServerInviteWithCreator:
      allOf:
        - $ref: '#/components/schemas/ServerInvite'
        - type: object
          properties:
            creator_username:
              type: string

    ChannelKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        wrapped_key:
          type: string
          description: Base64-encoded RSA-OAEP wrapped CSK
        key_version:
          type: integer
        created_at:
          type: string
          format: date-time

    ChannelUnreadCount:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        unread_count:
          type: integer

    PendingKeyRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        device_name:
          type: string
        ip_address:
          type: string
          description: Masked for privacy (e.g., 192.168.1.x)
        user_agent:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
        remember_me:
          type: boolean
        is_current:
          type: boolean

    PastSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        device_name:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # Phase 1C Schemas
    # ----------------------------------------------------------

    # Voice
    VoiceParticipant:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        is_muted:
          type: boolean
        is_deafened:
          type: boolean
        is_video_on:
          type: boolean
        is_screen_sharing:
          type: boolean
        joined_at:
          type: string
          format: date-time

    IceServer:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
        username:
          type: string
          nullable: true
        credential:
          type: string
          nullable: true

    VoiceJoinResponse:
      type: object
      properties:
        allowed:
          type: boolean
        media_server_url:
          type: string
        ice_servers:
          type: array
          items:
            $ref: '#/components/schemas/IceServer'
        channel:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            server_id:
              type: string
              format: uuid
            is_encrypted:
              type: boolean
            audio_quality_tier:
              type: string
              nullable: true
              enum: [minimum, low, moderate, standard, high, hifi, studio]

    DMVoiceJoinResponse:
      type: object
      properties:
        allowed:
          type: boolean
        media_server_url:
          type: string
        ice_servers:
          type: array
          items:
            $ref: '#/components/schemas/IceServer'
        conversation:
          type: object
          properties:
            id:
              type: string
              format: uuid
            is_encrypted:
              type: boolean

    # Channel Groups
    ChannelGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # DM
    DMConversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        is_group:
          type: boolean
        is_personal:
          type: boolean
        name:
          type: string
          nullable: true
        is_encrypted:
          type: boolean
        participants:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              username:
                type: string
              display_name:
                type: string
                nullable: true
              avatar_url:
                type: string
                nullable: true
        last_message:
          type: object
          nullable: true
          properties:
            content:
              type: string
            user_id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            is_encrypted:
              type: boolean
        unread_count:
          type: integer
        created_at:
          type: string
          format: date-time

    DMMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        is_encrypted:
          type: boolean
        type:
          type: string
        key_version:
          type: integer
        edited_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        username:
          type: string
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true

    DMKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        wrapped_key:
          type: string
          description: Base64-encoded RSA-OAEP wrapped key
        key_version:
          type: integer
        created_at:
          type: string
          format: date-time

    # Friends
    Friend:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    FriendRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        from_user_id:
          type: string
          format: uuid
        from_username:
          type: string
        from_display_name:
          type: string
          nullable: true
        from_avatar_url:
          type: string
          nullable: true
        to_user_id:
          type: string
          format: uuid
        to_username:
          type: string
        to_display_name:
          type: string
          nullable: true
        to_avatar_url:
          type: string
          nullable: true
        direction:
          type: string
          enum: [sent, received]
        created_at:
          type: string
          format: date-time

    FriendCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        code:
          type: string
          description: 8-character shareable code
        max_uses:
          type: integer
          nullable: true
        use_count:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_revoked:
          type: boolean
        auto_accept:
          type: boolean
        created_at:
          type: string
          format: date-time

    # Privacy
    PrivacySettings:
      type: object
      properties:
        messages_friends_only:
          type: boolean
          description: Only friends can send DMs (default true)
        messages_server_members:
          type: boolean
          description: Server members can send DMs (default true)
        auto_accept_friend_codes:
          type: boolean
          description: Auto-accept friend codes (default false)
        searchable_by_username:
          type: boolean
          description: Appear in username search (default false)
        searchable_by_email:
          type: boolean
          description: Searchable by email (default false)
        searchable_by_phone:
          type: boolean
          description: Searchable by phone (default false)
        updated_at:
          type: string
          format: date-time
          nullable: true

    # User Profile (public view)
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        header_image_url:
          type: string
          nullable: true
        color_scheme:
          type: string
          nullable: true
        links:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
