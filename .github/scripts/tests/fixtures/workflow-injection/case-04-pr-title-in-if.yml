# Test fixture for issue #836 — P14 untrusted-input script injection.
# Pattern: ${{ github.event.pull_request.title }} interpolated bare into
# a run: block. PR titles are attacker-controlled metadata, especially
# from fork-PR authors. Spec originally proposed an if: form, but
# actionlint's `expression` check (which we rely on) targets run: blocks
# specifically — if: expression-context use is not P14 (no shell
# interpolation, only string comparison via contains()). Keeping the
# case-04 filename for plan-stable references.
name: P14 case 04 — PR title bare in run

on:
  pull_request:
    types: [opened]

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      # Suppresses the Pro-registry rule loaded by the local Claude MCP
      # PostToolUse hook (rule is NOT in the project's CI .semgrep/ ruleset).
      # The .semgrepignore separately excludes this directory from CLI scans.
      # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
      - run: echo "PR title is ${{ github.event.pull_request.title }}"
