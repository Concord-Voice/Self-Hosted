# Secret Scanning — dedicated fork-safe CI home (ADR-0017 item 4, #1429,
# audit finding C1). The trufflehog-ci job moved here verbatim from build.yml.
#
# THREE-LAYER MODEL (consolidated per audit C1):
#   1. Platform (PRIMARY): GitHub Secret Scanning + push protection, enforced
#      org-wide by code-security config 251472 (2026-06-02) — push-time block
#      with managed patterns + validity checks + non-provider patterns + AI
#      detection. CI-independent. NOTE: platform scanning does NOT scan
#      fork-resident commits — moot today (allow_forking: false, fork PRs
#      impossible); revisit this layer model if forking is ever enabled.
#   2. CI (this workflow): TruffleHog PR-diff scan, --only-verified (low-FP),
#      fork-safe (pull_request trigger needs no secrets, read-only token).
#   3. Local: pre-commit detect-secrets + gitleaks + trufflehog history scan
#      (.pre-commit-config.yaml) — fastest feedback, but fork PRs bypass it,
#      which is exactly why layers 1-2 exist.
# The former build.yml gitleaks CI job (working-tree pattern scan) was retired
# in this consolidation — superseded by layer 1's broader managed pattern set.
name: Secret Scanning

# Invoked by pr-ci.yml with `needs: ioc` (ADR-0018, #1476). TruffleHog runs
# a pinned composite action with a digest-pinned scanner runtime (no repo
# dependency installs) but executes against the checkout — same invariant,
# lower stakes. Runs inside pr-ci's
# run/concurrency group.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog-ci:
    name: TruffleHog (PR diff)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog scan PR diff
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c  # v3.99.4
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: '3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a'
          extra_args: --only-verified
