# govulncheck — Go vulnerability scanning (call-graph reachability) → SARIF →
# Code Scanning (ADR-0017, #1433; absorbs #1227 — replaces the advisory
# text-mode "Dependency audit" step inside build.yml's control-plane job).
# Scope: services/control-plane — the repo's only Go module. Add a matrix leg
# if a second Go module with dependencies lands.
# Tool install is VERSION-PINNED (not @latest): golang.org/x/vuln resolves via
# the Go module proxy + checksum DB (sumdb), so a version pin is supply-chain
# equivalent to a SHA pin for Go modules (#847 spirit).
# Exit semantics: govulncheck exits 0 in -format=sarif mode even with findings;
# the fail-if-findings step preserves the previous fail-the-job signal until
# the code_scanning ruleset (A8/#1431) takes over gating.
name: govulncheck

# PR leg invoked by pr-ci.yml with `needs: ioc` (ADR-0018 IOC-first, #1476)
# — go install + module-graph resolution must not race the supply-chain
# verdict. The push leg stays in-file until main-ci.yml (#1477).
# push:main leg moved to main-ci.yml (#1477); concurrency lives at the
# orchestrators (main-ci queues, never cancels a baseline upload).
on:
  workflow_call:
    inputs:
      external-verdict:
        description: "Report actual SARIF upload provenance and delegate findings to the protected verifier"
        type: boolean
        default: false
        required: false
      selected-known:
        type: string
        required: false
      selected-pr-number:
        type: string
        required: false
      selected-head-sha:
        type: string
        required: false
      selected-base-sha:
        type: string
        required: false
      selected-merge-sha:
        type: string
        required: false

# Least-privilege default; the govulncheck job elevates to the writes it needs.
permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (control-plane)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # SARIF upload to Code Scanning
      security-events: write
      # required by upload-sarif in private repos to read the Actions run status
      actions: read
    steps:
      - name: Validate protected scan revision
        id: revision
        if: inputs.external-verdict
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_KNOWN: ${{ inputs.selected-known }}
          PR_NUMBER: ${{ inputs.selected-pr-number }}
          HEAD_SHA: ${{ inputs.selected-head-sha }}
          BASE_SHA: ${{ inputs.selected-base-sha }}
          MERGE_SHA: ${{ inputs.selected-merge-sha }}
          CALLER_REF: ${{ github.workflow_ref }}
          CALLER_SHA: ${{ github.workflow_sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          reject() { echo '::error::Protected scan revision input or provenance invalid'; exit 1; }
          test "$GITHUB_REPOSITORY" = 'Concord-Voice/Self-Hosted' || reject
          test "$GITHUB_EVENT_NAME" = 'pull_request' || reject
          test "$CALLER_REF" = 'Concord-Voice/Self-Hosted/.github/workflows/required-pr-build.yml@refs/heads/main' || reject
          [[ "$CALLER_SHA" =~ ^[0-9a-f]{40}$ ]] || reject
          test "$SELECTED_KNOWN" = 'true' || reject
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || reject
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || reject
          test "$EVENT_PR_NUMBER" = "$PR_NUMBER" || reject
          [[ "$EVENT_HEAD_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9_.-]{1,100}$ ]] || reject
          test "$EVENT_BASE_REF" = 'main' || reject
          test "$EVENT_HEAD_SHA" = "$HEAD_SHA" || reject
          test "$EVENT_BASE_SHA" = "$BASE_SHA" || reject
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/protected-scan-pr.json" 2>/dev/null || reject
          jq -e --argjson pr "$PR_NUMBER" --arg head_repo "$EVENT_HEAD_REPO" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg merge "$MERGE_SHA" \
            '.number == $pr and .head.repo.full_name == $head_repo and .base.ref == "main" and
             .head.sha == $head and .base.sha == $base and .merge_commit_sha == $merge' \
            "$RUNNER_TEMP/protected-scan-pr.json" >/dev/null || reject
          gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA" > "$RUNNER_TEMP/protected-scan-merge.json" 2>/dev/null || reject
          jq -e --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg merge "$MERGE_SHA" \
            '.sha == $merge and ([.parents[]?.sha] == [$base, $head])' \
            "$RUNNER_TEMP/protected-scan-merge.json" >/dev/null || reject
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.external-verdict && inputs.selected-merge-sha || '' }}
          persist-credentials: false

      - name: Confirm protected scan checkout
        if: inputs.external-verdict
        env:
          EXPECTED_SHA: ${{ inputs.selected-merge-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/control-plane/go.mod
          cache-dependency-path: services/control-plane/go.sum

      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan (SARIF)
        working-directory: services/control-plane
        run: govulncheck -format sarif ./... > govulncheck.sarif

      - name: Upload SARIF to Code Scanning
        # first-party, SHA-pinned for Alpha Code Scanning Gate (#1431).
        # Keep the trailing version comment bare: dependabot only rewrites that
        # exact shape, so an annotated one silently rots on every bump (#2309).
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: services/control-plane/govulncheck.sarif
          category: govulncheck
          ref: ${{ inputs.external-verdict && format('refs/pull/{0}/merge', inputs.selected-pr-number) || github.ref }}
          sha: ${{ inputs.external-verdict && inputs.selected-merge-sha || github.sha }}

      - name: Write protected govulncheck upload evidence
        if: inputs.external-verdict
        env:
          SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: |
          set -euo pipefail
          test -n "$SARIF_ID" || { echo "::error::govulncheck did not return a SARIF upload ID"; exit 1; }
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg category govulncheck --arg sarif_id "$SARIF_ID" \
            '{run_id:$run_id,run_attempt:$run_attempt,category:$category,sarif_id:$sarif_id}' \
            > "$RUNNER_TEMP/scan-evidence-govulncheck.json"

      - name: Upload protected govulncheck evidence
        if: inputs.external-verdict
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-evidence-${{ github.run_id }}-${{ github.run_attempt }}-govulncheck
          path: ${{ runner.temp }}/scan-evidence-govulncheck.json
          if-no-files-found: error
          retention-days: 1

      - name: Fail on reachable-vulnerability findings
        working-directory: services/control-plane
        env:
          EXTERNAL_VERDICT: ${{ inputs.external-verdict }}
        run: |
          COUNT=$(jq '[.runs[].results[]? | select(.level != "note")] | length' govulncheck.sarif)
          echo "govulncheck findings (non-note): ${COUNT}"
          if [ "${COUNT}" -gt 0 ] && [ "$EXTERNAL_VERDICT" != 'true' ]; then
            echo "::error::govulncheck found ${COUNT} reachable vulnerability finding(s) — see the Security tab (category: govulncheck)."
            exit 1
          fi
