name: CodeQL PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Title/body-only edits must not cancel a CodeQL run for the current head.
  # Base retargets and edits with unknown changes use the ordinary group.
  group: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && format('codeql-pr-metadata-{0}', github.event.pull_request.number) || format('codeql-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  ioc:
    if: ${{ !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    uses: ./.github/workflows/ioc-scanning.yml
    permissions:
      contents: read
      pull-requests: read

  codeql:
    needs: [ioc]
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    uses: ./.github/workflows/codeql.yml
