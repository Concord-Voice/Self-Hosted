name: Refresh transitive Go module graph

# Runs Tuesday 06:00 UTC. Dependabot's gomod ecosystem fires the same day
# (`day: tuesday` in .github/dependabot.yml, no `time:` pinned) — its exact
# fire time isn't guaranteed and may land before, during, or after our
# 06:00 UTC slot. Timing-independence is structural via the contention
# guard job below, NOT via this cron's choice; do not rely on "06:00
# precedes Dependabot" as an invariant.
#
# PR authorship: the PR is opened with a short-lived GitHub App installation
# token, not `GITHUB_TOKEN`. A `GITHUB_TOKEN`-authored PR starts no
# `pull_request` workflows, and this repository does not let Actions create
# pull requests at all. An App-authored PR runs the full PR check set on its
# own, with no close-and-reopen step for the reviewer.
#
# Three jobs, and the split is a security boundary. A job receives every secret
# it references, and its `GITHUB_TOKEN`, when the job starts, whatever the step
# order. Minting the token "late" inside one job would still put the App private
# key on the runner while `go get -u` downloads and resolves third-party modules.
#   guard    holds the only `GITHUB_TOKEN` write scope (`pull-requests`), for
#            the deferral comment. It checks out nothing and runs no Go tooling.
#   refresh  fetches modules. Its `GITHUB_TOKEN` is read-only and it references
#            no secret.
#   open-pr  holds the App key. It runs no Go tooling: it copies go.mod and
#            go.sum out of the artifact, and create-pull-request reads the
#            rendered body from the artifact directory.
# Do not merge the jobs, and do not add Go commands to guard or open-pr.
# scripts/tests/test-go-transitive-flush-render.sh locks these rules.
#
# Output PR is processed by /weekly-deps Wednesday review window.
# See [internal]rules/backend.md § Dependency Hygiene.
# Spec: [internal]specs/2026-05-28-1212-go-transitive-hygiene-design.md

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

# Least-privilege default. The guard job adds only `pull-requests: write`, for
# its `gh pr comment`. The branch push and the PR itself use
# the App installation token, so `GITHUB_TOKEN` never needs `contents: write`.
permissions:
  contents: read

concurrency:
  group: go-transitive-flush
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      deferred: ${{ steps.contention.outputs.deferred }}
    steps:
      - name: Contention guard — defer if open Dependabot Go PRs exist
        id: contention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so `gh` cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Query open Dependabot Go PRs against services/control-plane
          OPEN_PRS=$(gh pr list \
            --search "head:dependabot/go_modules/services/control-plane" \
            --state open \
            --json number \
            --jq '[.[].number] | join(" ")')

          if [ -z "$OPEN_PRS" ]; then
            echo "No open Dependabot Go PRs. Proceeding."
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Open Dependabot Go PRs detected: $OPEN_PRS"
          echo "deferred=true" >> "$GITHUB_OUTPUT"

          TODAY=$(date -u +%Y-%m-%d)
          MARKER="<!-- go-transitive-flush-deferral-${TODAY} -->"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Render deferral comment body to a tempfile (heredoc-to-file pattern;
          # avoids multi-line bash strings breaking YAML literal-block indentation).
          # Intentionally generated ONCE before the per-PR loop — the body has no
          # per-PR substitutions, so reusing the same file for every PR in the loop
          # is correct. If future maintainers add per-PR substitution, move the
          # cat-heredoc INSIDE the loop.
          cat > /tmp/deferral-comment.md <<DEFERRAL
          ${MARKER}

          \`go-transitive-flush\` workflow deferred this week's run — this branch is open against \`services/control-plane/go.sum\`, which would conflict with a parallel transitive-flush PR. Will re-run next Tuesday 06:00 UTC.

          If you'd prefer to merge this PR first to unblock the next transitive-flush, no action needed — the workflow will re-check next week and proceed if your branch has merged or been closed.

          — Run: ${RUN_URL}
          DEFERRAL

          # Idempotency: skip comment if a deferral was added in last 6 days (518400s)
          for PR in $OPEN_PRS; do
            RECENT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              --jq '[.[] | select(.body | contains("<!-- go-transitive-flush-deferral-")) | select(.created_at | fromdateiso8601 > (now - 518400))] | length')

            if [ "$RECENT" -gt 0 ]; then
              echo "PR #${PR} already has a recent deferral comment. Skipping."
              continue
            fi

            gh pr comment "$PR" --body-file /tmp/deferral-comment.md
            echo "Added deferral comment to PR #${PR}."
          done

          echo "Exiting success-skip due to contention."
          exit 0

  refresh:
    needs: guard
    if: needs.guard.outputs.deferred != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # 'true' or 'false' from the refresh step; empty when this job is skipped.
      has_changes: ${{ steps.refresh.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No module or build cache: a cache entry is state shared between runs,
      # and this job resolves third-party modules.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/control-plane/go.mod
          cache: false

      - name: Refresh transitive Go module graph
        id: refresh
        working-directory: services/control-plane
        run: |
          set -euo pipefail
          echo "Running go get -u ./... && go mod tidy"
          go get -u ./...
          go mod tidy

          # Stat the result for the PR body
          if git diff --quiet go.mod go.sum 2>/dev/null; then
            echo "No transitive updates available. The open-pr job will be skipped."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in go.mod / go.sum."
            git diff --stat go.mod go.sum
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render PR body
        if: steps.refresh.outputs.has_changes == 'true'
        env:
          # Passed via env rather than inlined into the script. `github.event_name` is
          # a fixed enum and not attacker-controllable, but the env-block form is the
          # repo-wide convention for context expressions inside `run:` and costs
          # nothing to follow.
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Render the REAL generation stamp. This was hardcoded as "Tuesday ... at
          # 06:00 UTC", so every manual `workflow_dispatch` produced a body that
          # misstated its own origin — wrong day-of-week, wrong time, and a
          # Coordination section claiming a cron cadence that was not in play. The
          # ad-hoc dispatch path is sanctioned (backend.md § Dependency Hygiene), so
          # the body has to be able to describe it.
          GEN_STAMP=$(date -u '+%A %Y-%m-%d at %H:%M UTC')

          # Measure what `go mod tidy` actually did instead of asserting it. The
          # "Cleanup of orphan modules" bullet used to be unconditional boilerplate
          # describing something that usually had not happened.
          GOMOD=services/control-plane/go.mod
          # Every grep here is `|| true`-guarded, and that is load-bearing under
          # `set -euo pipefail`: a grep matching nothing exits 1, pipefail promotes
          # that to the pipeline, and `set -e` then kills the step BEFORE the body is
          # written — so no PR is opened at all. The unguarded form died on any run
          # where `go mod tidy` only removed modules (zero '+' lines), i.e. exactly
          # the orphan-cleanup case these counts exist to report. Regression-tested
          # by scripts/tests/test-go-transitive-flush-render.sh.
          # Handles BOTH go.mod requirement forms: the indented block entry
          # ("\tgithub.com/foo/bar v1.0.0") and the single-line directive
          # ("require github.com/foo/bar v1.0.0"). Keying on whitespace after the
          # diff marker matched only the block form and silently scored a
          # single-line-require module graph as 0/0/0.
          # After normalising the marker and any `require ` prefix, a requirement is
          # exactly a line whose second field is a version — which also rejects
          # `require (`, `)`, `module …`, `go …` and `toolchain …` without listing them.
          mod_paths() { # $1 = extended regex selecting the diff marker ('^\+' or '^-')
            git diff -- "$GOMOD" \
              | { grep -E "$1" || true; } \
              | { grep -vE '^(\+\+\+|---)' || true; } \
              | sed -E 's/^[+-][[:space:]]*//; s/^require[[:space:]]+//' \
              | awk '$2 ~ /^v[0-9]/ { print $1 }' \
              | sort -u
          }
          ADDED=$(mod_paths '^\+')
          REMOVED=$(mod_paths '^-')
          N_BUMPED=$(comm -12 <(printf '%s\n' "$ADDED") <(printf '%s\n' "$REMOVED") | grep -c . || true)
          N_NEW=$(comm -23 <(printf '%s\n' "$ADDED") <(printf '%s\n' "$REMOVED") | grep -c . || true)
          N_ORPHANED=$(comm -13 <(printf '%s\n' "$ADDED") <(printf '%s\n' "$REMOVED") | grep -c . || true)

          cat > /tmp/pr-body.md <<EOF
          Automated refresh of the transitive Go module graph for \`services/control-plane\`.

          Generated by \`.github/workflows/go-transitive-flush.yml\` (trigger: \`${TRIGGER}\`) on ${GEN_STAMP}.

          ## What this PR contains

          \`go get -u ./... && go mod tidy\` was run against the current \`main\`, producing
          **${N_BUMPED} module(s) bumped, ${N_NEW} added, ${N_ORPHANED} orphaned module(s) removed**:
          - Direct deps bumped to latest minor+patch
          - Indirect deps that newer direct/indirect versions now require (MVS resolution)
          - Orphan cleanup by \`go mod tidy\` (the count above is measured from the diff, not assumed)

          ## Review checklist

          - [ ] \`go test -race ./...\` is green in CI
          - [ ] Integration suite is green in CI
          - [ ] No major-version transitive crossings present (look for \`vX.Y.Z → vX+1.0.0\` in go.mod diff). If any present, manually inspect the consuming code for compatibility.
          - [ ] Diff size is plausible (after the initial backlog flush, expect 5-15 modules/week; >50 = investigate)
          - [ ] No new direct deps appeared in go.mod (they should only be bumped, not added)

          ## Coordination

          The contention guard ran before this PR was generated and verified no open Dependabot Go PRs against \`services/control-plane/\`. That guard runs on every invocation regardless of trigger, so the check is not tied to any particular day or time. If a Dependabot Go PR opens between this PR's creation and merge, expect a rebase comment from \`/weekly-deps\`.

          ## Refs

          - Mechanism rationale: the backend Dependency Hygiene rule (internal development docs)
          - Triage workflow: \`/weekly-deps\` Phase 1
          EOF
          echo "Rendered PR body to /tmp/pr-body.md"

      - name: Stage the PR payload
        if: steps.refresh.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flush"
          cp services/control-plane/go.mod services/control-plane/go.sum /tmp/pr-body.md "$RUNNER_TEMP/flush/"

      - name: Upload the PR payload
        if: steps.refresh.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-transitive-flush
          path: ${{ runner.temp }}/flush
          retention-days: 1
          if-no-files-found: error

  open-pr:
    needs: refresh
    if: needs.refresh.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-transitive-flush
          path: ${{ runner.temp }}/flush

      # The payload is data from the lower-trust job. It is copied, never executed.
      - name: Apply the refreshed module files
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/flush/go.mod" "$RUNNER_TEMP/flush/go.sum" services/control-plane/

      # Same App and same pinned action as refresh-ioc-list.yml.
      - name: Mint flush App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PUBLIC_MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_MIRROR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR
        # SHA-pinned per supply-chain hardening. Same SHA as refresh-ioc-list.yml.
        # Upgrade procedure: `gh api repos/peter-evans/create-pull-request/git/refs/tags/vX.Y.Z`,
        # replace SHA + comment.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Pin BOTH identities. create-pull-request defaults `author` to
          # `github.actor`, which on a workflow_dispatch run is whoever pressed the
          # button — so `git log --format=%an` on main attributed a machine-generated
          # `go get -u` result to a human, and did so nondeterministically (scheduled
          # and dispatched runs resolved github.actor differently).
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: chore/go-transitive-flush
          delete-branch: true
          title: "chore: refresh transitive Go module graph (services/control-plane)"
          labels: "area: deps,area: control-plane,area: ci-cd,domain: developer-experience,routine: go-transitive-hygiene"
          commit-message: "chore: refresh transitive Go module graph"
          body-path: ${{ runner.temp }}/flush/pr-body.md
          add-paths: |
            services/control-plane/go.mod
            services/control-plane/go.sum
