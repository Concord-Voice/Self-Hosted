# ── Pre-commit hooks ─────────────────────────────────────────────────────────
# Single source of truth for local code quality checks.
# Install: pipx install pre-commit && ./scripts/install-git-hooks.sh
# Manual run: PRE_COMMIT_COLOR=never pre-commit run --all-files
# Update:  pre-commit autoupdate
#
# These hooks run the same checks SonarQube runs in CI, catching issues locally
# before they consume GitHub Actions budget. No tests or coverage here — that's
# SonarQube's job in the Build workflow.

# Hook-level `fail_fast` (the interpreter guard below) needs 2.16.0. An older
# pre-commit ignores the key, prints the guard's refusal and runs on into the
# hang the guard exists to prevent, so refuse it here instead.
minimum_pre_commit_version: '2.16.0'

repos:
  # ── Interpreter guard — MUST stay the first hook (#3426) ──────────────────
  # On macOS, bash 5.1.0 through 5.3.15 writes a heredoc that fits its
  # BUILD-TIME pipe-size estimate into a pipe with one blocking write, before
  # it execs the reader. A macOS pipe starts at 512 bytes and grows only while
  # system-wide pipe memory is under its limit (xnu bsd/kern/sys_pipe.c), so
  # under load any heredoc over 512 bytes, measured after expansion, can block
  # with nobody left to read it, whatever command reads it. Many hooks below
  # feed heredocs that size; one pre-commit run hung ~17 min on 2026-09-23.
  # Fixed upstream in bash 5.3 patch 16; Linux and /bin/bash 3.2 are safe.
  #
  # fail_fast makes the refusal stop the run before any later hook starts;
  # without it pre-commit prints the refusal and then hangs in the next hook.
  # The guard declares no `stages`, and this file sets no `default_stages`, so
  # it runs at every stage any hook runs at (manual and pre-push included).
  # scripts/test-check-bash-heredoc-hang.sh pins all of this.
  - repo: local
    hooks:
      - id: bash-heredoc-hang-guard
        name: bash heredoc-hang guard (macOS bash 5.1–5.3.15)
        entry: scripts/check-bash-heredoc-hang.sh
        language: script
        always_run: true
        pass_filenames: false
        fail_fast: true
      # python, not script: the self-test reads this file with PyYAML, which an
      # ambient python3 need not carry (the same reason as the dependabot audit
      # hooks). Version tracks .github/requirements-pyyaml.txt.
      - id: test-check-bash-heredoc-hang
        name: Test the bash heredoc-hang guard and its wiring (#3426)
        entry: scripts/test-check-bash-heredoc-hang.sh
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^(\.pre-commit-config\.yaml|scripts/(check|test-check)-bash-heredoc-hang\.sh)$'
        pass_filenames: false

      - id: go-toolchain-alignment
        name: Go toolchain matches all Docker builders
        entry: python3 scripts/check-go-toolchain.py
        language: system
        files: '^(services/control-plane/(go\.mod|Dockerfile(?:\.(?:ops-agent|redis-auth-controller|turn-secret-writer))?)|scripts/(?:test-)?check-go-toolchain\.py|\.pre-commit-config\.yaml)$'
        pass_filenames: false
      - id: test-go-toolchain-alignment
        name: Test Go toolchain guard (planted mismatches)
        entry: python3 scripts/test-check-go-toolchain.py
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^(scripts/(?:test-)?check-go-toolchain\.py|scripts/check-license-check-go-pin\.sh|\.github/workflows/license-check\.yml|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: secrets-catalog
        name: Check secret catalog against literal workflow consumers
        entry: python3 scripts/check-secrets-catalog.py
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        pass_filenames: false
        always_run: true
      - id: test-secrets-catalog
        name: Test secret catalog checker and integration wiring
        entry: python3 -m unittest discover -s scripts/tests -p test_secrets_catalog.py
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        pass_filenames: false
        always_run: true

  # ── Security ──────────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Exclude paths where high-entropy strings are expected test data:
        #   - package-lock.json: npm integrity hashes
        #   - client/desktop/tests/fixtures/pinning/: SPKI SHA-256 test
        #     fingerprints, reproducible from the PEMs in the same directory
        #     (issue #658 cert pinning).
        #   - services/control-plane/internal/age/testdata/: the age-claim
        #     cross-impl fixture's RSA-PSS test signature + PUBLIC key SPKI
        #     (base64). Reproducible via `UPDATE_AGE_FIXTURE=1 go test`; no
        #     private key is committed (#1623 child-B contract).
        #   - prototypes/: vendored Claude Design HTML/JS prototype exports.
        #     Their high-entropy strings are public CDN Subresource-Integrity
        #     (sha384) hashes; real secrets are still caught by GitHub push
        #     protection + the CI verified-secret scan (#204 mobile prototype).
        #   - graphify-out/{graph.json,graph.html,manifest.json}: generated
        #     graph identifiers and content digests. The queryable graph is
        #     intentionally versioned; CI still performs a verified-secret
        #     scan on the PR diff.
        #   - services/control-plane/internal/authoritycontract/testdata/vectors.json:
        #     the #3587 authority-contract vectors, regenerated with fresh
        #     ephemeral keys by scripts/authority-vectors/gen.mjs. In clear they
        #     hold public P-384 points, RSA SPKIs, digests and signatures, plus
        #     one private field: recipient_dkx_d, a 48-byte test-only ECDH scalar
        #     on each PR-A2 device-wrap-open vector. That scalar opens the vector's
        #     wrap ciphertext, whose plaintext holds test PKCS#8 private keys (a
        #     root and an EK) of the wrap vectors' own account. Compensating
        #     controls: vectors_hygiene_test.go pins the closed field-name set and
        #     refuses any PKCS#8, SEC1 or PKCS#1 private key in clear anywhere in
        #     the file, including inside messages; and
        #     vectors_wrap_hygiene_test.go opens every wrap and refuses a
        #     recovered key that any other vector publishes or that a package test
        #     file or gen.mjs commits, so the openable keys stay single-use.
        exclude: '(package-lock\.json|client/desktop/tests/fixtures/pinning/.*|services/control-plane/internal/age/testdata/.*|services/control-plane/internal/authoritycontract/testdata/vectors\.json|prototypes/.*|graphify-out/(graph\.json|graph\.html|manifest\.json))'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
        # The versioned Graphify graph is a generated, queryable repository
        # artifact. Keep its manifest and report under the normal size limit.
        # The account-authority conformance vectors are the DoR's single
        # committed file; vectors_hygiene_test.go bounds them at 8 MiB instead.
        exclude: '^(graphify-out/graph\.json|services/control-plane/internal/authoritycontract/testdata/vectors\.json)$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        # Lint test fixtures named `*-malformed.yml` are intentionally
        # not valid YAML — they exercise the script-error path of the
        # workflow-lint scanners (#920 §5.1 case-05 and future siblings).
        # case-09-yaml-error/workflows/broken.yml: intentionally malformed YAML
        # fixture that exercises the YAML-parse-error path of
        # lint-branch-protection.sh (#999 G2 reconciliation finding #2).
        # These exact Compose overlays carry merge tags safe_load cannot
        # construct. They get the syntax-only pass below and retain the
        # semantic Compose contracts in the deployment tests.
        exclude: '(.*-malformed\.yml$|\.github/scripts/tests/fixtures/branch-protection-lint/case-09-yaml-error/workflows/broken\.yml|^(docker-compose\.(production|staging|west-staging|selfhost|byo-s3|media-shared|redis-managed)\.yml|scripts/public-mirror/public-overlay/docker-compose\.production\.yml)$)'
      - id: check-yaml
        alias: check-yaml-compose-merge-tags
        name: check yaml (syntax only — Compose merge tags, #3538, #1899)
        args: ['--unsafe']
        files: '^(docker-compose\.(production|staging|west-staging|selfhost|byo-s3|media-shared|redis-managed)\.yml|scripts/public-mirror/public-overlay/docker-compose\.production\.yml)$'
      - id: check-json
        # package-lock.json: excluded by default (large, not authored JSON).
        # case-05-malformed/bp.json: intentionally truncated JSON fixture that
        # exercises the script-error path (exit 2) of lint-branch-protection.sh
        # (#999 G2 Task 6). Mirrors the check-yaml exclude pattern for
        # malformed YAML fixtures.
        exclude: '(package-lock\.json|\.github/scripts/tests/fixtures/branch-protection-lint/case-05-malformed/)'
      - id: detect-private-key
      - id: end-of-file-fixer
        # scripts/fixtures/plugin-cache/*.section.md are byte-exact payloads,
        # not prose: their bytes are digest-pinned in marker-sections.sha256 and
        # spliced verbatim into the plugin cache. Normalizing the trailing
        # newline changes the digest and drops the blank line before the anchor
        # heading. (#2665)
        exclude: '(\.svg$|^scripts/fixtures/plugin-cache/.*\.section\.md$)'
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  # Three-layer secret-scanning model (#1429 / audit C1): this LOCAL layer
  # (trufflehog history scan + gitleaks + detect-secrets) is the fastest
  # feedback; the CI layer is the fork-safe PR-diff verified-only scan in
  # .github/workflows/secret-scanning.yml; the PRIMARY layer is GitHub
  # Secret Scanning + push protection, org-enforced (code-security config
  # 251472) — fork PRs bypass pre-commit, which is why the other layers exist.
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.0
    hooks:
      - id: trufflehog
        name: TruffleHog
        entry: bash -c 'trufflehog git file://. --since-commit HEAD --only-verified --fail'

  # gitleaks stays in the local layer; its CI working-tree job was retired in
  # the #1429 consolidation (superseded by platform push protection).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # ── Authority-contract vectors drift (#3587 PR-A1, DoR §3.1) ───────────
  # testdata/vectors.json records the SHA-384 of the gen.mjs that wrote it.
  # A generator edit without regeneration (or a hand-edited vectors file)
  # fails here; CI checks the same digest in the Go and vitest suites.
  - repo: local
    hooks:
      - id: authority-vectors-drift
        name: authority vectors were written by this gen.mjs
        entry: node scripts/authority-vectors/gen.mjs --check
        language: system
        pass_filenames: false
        files: '^scripts/authority-vectors/|authoritycontract/testdata/vectors\.json$'

  # ── GitHub Actions workflow-injection guard (#836) ───────────────────────
  # actionlint catches P14 (untrusted-input script injection, CWE-94) and
  # ~30 other workflow-lint issues. Companion to .github/scripts/lint-*.sh.
  # See [internal]workflow-failure-patterns.md P14 and
  # [internal]specs/2026-05-20-836-workflow-injection-guard-design.md.
  #
  # Tag-pinned to match existing pre-commit hook conventions (detect-secrets,
  # trufflehog, gitleaks all use tag pins). SHA-pinning per
  # [internal]rules/electron.md applies to third-party GHA actions in workflows,
  # not pre-commit hooks.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Shellcheck integration is ENABLED. The 27 pre-existing shellcheck
        # info/style findings that motivated the earlier `-shellcheck=`
        # disable have been cleaned up — 8 distinct script-block fixes in
        # #1088 (build.yml, build-desktop.yml, sync-releases.yml) plus the
        # bundled provision-secrets.yml fix in this commit. actionlint now
        # runs its full check set (expression + shellcheck + syntax + …).
        args: ['-config-file=.actionlint.yaml']
        # actionlint's default files-glob covers .github/workflows/*.yml.

  # ── Supply-chain (Shai-Hulud 2.0 IOC scanner) ────────────────────────────
  # See [internal]supply-chain-defense.md. Spec: #715.
  - repo: local
    hooks:
      - id: supply-chain-ioc-scan
        name: supply-chain IOC scan (Shai-Hulud 2.0)
        entry: scripts/security/scan-supply-chain-iocs.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: self-hosted-runner-lint
        name: self-hosted runner allowlist
        # Exit 2 means "expression runner, cannot statically verify" — the
        # linter keeps this as a finding for CI strictness, but at the local
        # pre-commit layer we treat it as non-blocking (stderr is still shown
        # so the developer sees the warning). Exit 1 (self-hosted+non-allowlisted)
        # and 10 (parser failure) still block.
        entry: bash -c 'scripts/security/check-self-hosted-runners.sh; rc=$?; [ "$rc" = "2" ] && exit 0 || exit $rc'
        language: system
        pass_filenames: false
        files: '^\.github/workflows/.*\.ya?ml$'

      - id: check-env-file
        name: env-file shell-parse lint
        # Blocks commits that add env-file values whose unquoted form would
        # fail when sourced by bash. Rejects the following in unquoted values:
        # space, <, >, ;, `, $, |, &, \ — plus unclosed quotes and quoted
        # values with trailing extra content (e.g. KEY="foo" "bar").
        # See #725 Track 4 — the deploy.env.local:15 shell-parse regression
        # is the class this hook prevents.
        entry: scripts/check-env-file.sh
        language: script
        files: '\.env(\.example|\.local)?$'
        pass_filenames: true

      # ── Workflow-file structural guards (#920/#2274 trust-model lock-ins) ──
      # These hooks codify the desktop trust boundary and invariants surfaced
      # by the 2026-05-09 cascade (#893/#900/#904/#906/#910). Each fires when a
      # workflow file is in the commit; the script scans the entire
      # .github/workflows/ tree so cross-file references stay consistent.

      - id: lint-pr-release-trust
        name: workflow lint — desktop PR/release trust boundary (#2274)
        entry: bash .github/scripts/lint-pr-release-trust.sh .
        language: system
        files: '^(\.github/scripts/lint-pr-release-trust\.sh|\.github/scripts/tests/lint-pr-release-trust\.test\.sh|\.github/workflows/.*\.ya?ml)$'
        pass_filenames: false

      - id: test-lint-pr-release-trust
        name: workflow lint self-test — desktop PR/release trust boundary (#2274)
        entry: bash .github/scripts/tests/lint-pr-release-trust.test.sh
        language: system
        files: '^(\.github/scripts/lint-pr-release-trust\.sh|\.github/scripts/tests/lint-pr-release-trust\.test\.sh|\.github/workflows/.*\.ya?ml)$'
        pass_filenames: false

      # A caller that under-grants its callee fails the WHOLE RUN at startup —
      # startup_failure, zero jobs, no log. actionlint cannot see this (it is a
      # cross-file permission relation, not syntax), and a schedule-only
      # orchestrator never executes in PR CI, so nothing else catches it. Cost a
      # silently-dead nightly on 2026-08-26.
      - id: test-promote-unreleased-changelog
        name: release-notes promoter self-test
        entry: bash .github/scripts/tests/promote-unreleased-changelog.test.sh
        language: system
        files: '^(\.github/scripts/promote-unreleased-changelog\.sh|\.github/scripts/promote_unreleased_changelog\.py|\.github/scripts/tests/promote-unreleased-changelog\.test\.sh|CHANGELOG\.md)$'
        pass_filenames: false

      # The hotfix label decides whether main-ci dispatches an UNGATED release,
      # so its resolution is security-relevant, and it silently mis-answered on
      # 2026-08-29 (#3013): the commit->PR association is eventually consistent
      # and was queried 19 s after the merge. The suite's load-bearing case is
      # the race itself — association empty, then resolving on retry.
      - id: test-resolve-hotfix-label
        name: hotfix-label resolution self-test (release fast-path)
        entry: bash .github/scripts/tests/resolve-hotfix-label.test.sh
        language: system
        files: '^(\.github/scripts/resolve-hotfix-label\.sh|\.github/scripts/tests/resolve-hotfix-label\.test\.sh|\.github/workflows/main-ci\.ya?ml)$'
        pass_filenames: false

      # container-image-scan.yml must not let a scan that saw nothing read as
      # clean: every Trivy call reads the local daemon only (--image-src docker),
      # and each leg's report must detect the expected OS with its packages.
      - id: test-trivy-assert-os
        name: container image scan silent-clean guards self-test
        entry: bash .github/scripts/tests/trivy-assert-os.test.sh
        language: system
        files: '^(\.github/scripts/trivy-assert-os\.sh|\.github/scripts/tests/trivy-assert-os\.test\.sh|\.github/workflows/container-image-scan\.ya?ml)$'
        pass_filenames: false

      - id: lint-workflow-call-contract
        name: workflow lint — workflow_call contract (permissions superset + secrets agree)
        entry: bash .github/scripts/lint-workflow-call-contract.sh .
        language: system
        files: '^(\.github/scripts/lint-workflow-call-contract\.sh|\.github/scripts/tests/lint-workflow-call-contract\.test\.sh|\.github/workflows/.*\.ya?ml)$'
        pass_filenames: false

      - id: test-lint-workflow-call-contract
        name: workflow lint self-test — workflow_call contract
        entry: bash .github/scripts/tests/lint-workflow-call-contract.test.sh
        language: system
        files: '^(\.github/scripts/lint-workflow-call-contract\.sh|\.github/scripts/tests/lint-workflow-call-contract\.test\.sh|\.github/workflows/.*\.ya?ml)$'
        pass_filenames: false

      # The deployment client owns a private per-target tunnel and strict
      # origin pinning. Keep its hermetic refusal/lifecycle suite runnable
      # locally whenever the implementation, suite, or PR runner changes.
      - id: test-deployment-client
        name: pinned deployment client self-test
        entry: bash .github/scripts/tests/deployment-client.test.sh
        language: system
        files: '^(.github/scripts/deployment-client\.sh|\.github/scripts/tests/deployment-client\.test\.sh|\.github/workflows/pr-ci\.yml)$'
        pass_filenames: false

      - id: check-provision-secrets-source
        name: workflow lint — provision-secrets Infisical source drift-lock (#2317)
        # ADR-0033: provision-secrets.yml sources runtime values from
        # Infisical. Locks the residual secrets.* allowlist, the SECRET_
        # convention, id-token: write, fetch-before-Resolve ordering, and
        # the absence of bootstrap remnants.
        entry: scripts/check-provision-secrets-source.sh
        language: script
        files: '^(\.github/workflows/provision-secrets\.yml|scripts/check-provision-secrets-source\.sh)$'
        pass_filenames: false

      - id: test-check-provision-secrets-source
        name: workflow lint self-test — provision-secrets drift-lock (#2317)
        entry: bash scripts/test-check-provision-secrets-source.sh
        language: system
        files: '^(\.github/workflows/provision-secrets\.yml|scripts/(test-)?check-provision-secrets-source\.sh)$'
        pass_filenames: false

      - id: test-provision-secrets-encoder
        name: workflow lint self-test — Compose dotenv encoder rejects and FAILS
        entry: bash scripts/test-provision-secrets-encoder.sh
        language: system
        files: '^(\.github/workflows/provision-secrets\.yml|scripts/test-provision-secrets-encoder\.sh)$'
        pass_filenames: false

      - id: check-deploy-ref-gate
        name: workflow lint — main-cd dispatch-ref trust boundary (#2966)
        # main-cd.yml's workflow_dispatch takes a free-form `ref`, and five jobs
        # check it out and run code from it — two holding production credentials,
        # one minting an attestation the control-plane trusts. The environment
        # gate approves the WORKFLOW's ref, not the input. Locks that every such
        # job validates ancestry BEFORE the untrusted checkout, dispatch-only,
        # failing closed. deploy.sh's own check cannot serve: it is read FROM the
        # ref under judgment.
        entry: scripts/check-deploy-ref-gate.sh
        language: script
        files: '^(\.github/workflows/main-cd\.yml|scripts/check-deploy-ref-gate\.sh)$'
        pass_filenames: false

      - id: test-check-deploy-ref-gate
        name: workflow lint self-test — dispatch-ref trust boundary (#2966)
        entry: bash scripts/test-check-deploy-ref-gate.sh
        language: system
        files: '^(\.github/workflows/main-cd\.yml|scripts/(test-)?check-deploy-ref-gate\.sh)$'
        pass_filenames: false

      - id: test-deploy-target-admission
        name: fleet target admission and serving policy (#2751)
        entry: bash .github/scripts/tests/deploy-targets.test.sh
        language: system
        files: '^(\.github/deploy-targets\.json|\.github/scripts/deploy_targets\.py|\.github/scripts/tests/deploy[-_]targets(_test)?\.py|\.github/scripts/tests/deploy-targets\.test\.sh|\.github/scripts/tests/west_staging_workflow_test\.py|\.github/workflows/(deploy-west-staging|main-cd|sync-releases|provision-secrets|provision-cloudflare-secrets|attachment-reaper-index|attachment-r2-probe)\.yml|\.github/(ci/scan-relevance\.yml|workflows/pr-ci\.yml)|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-fleet-workflow-callers
        name: fixed fleet workflow callers (#2751)
        entry: bash .github/scripts/tests/fleet-callers.test.sh
        language: system
        files: '^(.github/deploy-targets\.json|\.github/scripts/(deploy_targets\.py|deployment-client\.sh|deployment-access-proof\.sh|tests/(deployment_access_proof_test\.py|fleet_callers_test\.py|fleet-callers\.test\.sh))|\.github/workflows/(deployment-access|sync-releases|provision-cloudflare-secrets|attachment-reaper-index|attachment-r2-probe|pr-ci)\.yml|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-fleet-main-cd
        name: main-cd preflight, staging, and serving-gate DAG (#2751)
        entry: bash .github/scripts/tests/fleet-main-cd.test.sh
        language: system
        files: '^(\.github/workflows/main-cd\.yml|\.github/scripts/(deploy_targets\.py|deployment-client\.sh|fleet_preflight\.py|tests/(fleet_main_cd_test\.py|fleet-main-cd\.test\.sh))|infrastructure/deploy/(deploy\.sh|stage-release\.py|tests/Dockerfile\.selfhost-hook)|scripts/(check-deploy-ref-gate\.sh|test-check-deploy-ref-gate\.sh)|\.github/(ci/scan-relevance\.yml|workflows/pr-ci\.yml)|\.pre-commit-config\.yaml)$'
        pass_filenames: false

      - id: test-fleet-stage-and-writer-contracts
        name: fleet stage and runtime-writer contract tests (#2751)
        entry: bash -c 'bash [internal]tests/test-stage-release.sh && bash [internal]tests/test-fleet-writers.sh && bash [internal]tests/test-west-staging.sh'
        language: system
        files: '^(.pre-commit-config\.yaml|\.github/(deploy-targets\.json|scripts/(deploy_targets\.py|deployment-client\.sh)|workflows/(main-cd|pr-ci|provision-secrets|sync-releases|provision-cloudflare-secrets|attachment-reaper-index|attachment-r2-probe)\.yml)|scripts/check-env-file\.sh|infrastructure/deploy/(deploy\.sh|deploy-manifest\.txt|stage-release\.py|deploy\.env\.example|provision-production\.sh|tests/(test-stage-release\.sh|stage_release_test\.py|stage_deploy_integration\.py|test-deploy\.sh|test-fleet-writers\.sh|fleet_writers_test\.py))|docker-compose\.west-staging\.yml|infrastructure/docker/iptables/docker-user-rules\.sh|infrastructure/deploy/(concord-ctl\.sh|provision-west-staging\.sh|west-stage-app\.sh|west-stage-manifest\.txt|nginx/west-staging\.conf\.template|coturn/west-staging\.conf|tests/(west_staging_test\.py|test-west-staging\.sh)))$'
        pass_filenames: false

      - id: lint-multisecret-andcheck
        name: workflow lint — multi-secret AND-check completeness (#920 §5.2)
        # Invariant 5: if a step gates on one secret from a known
        # multi-secret group (apple-p12, apple-api-key, azure-oidc,
        # azure-signing) via env.X != '' or [[ -n "$X" ]], it must
        # AND-check ALL members. Half-rotated secret pairs fail closed
        # at if-eval time rather than at action runtime (PR #904 class).
        entry: .github/scripts/lint-multisecret-andcheck.sh
        args: ['.github/workflows/']
        language: script
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false

      - id: lint-always-needs-comment
        name: workflow lint — always() requires justification comment (#920 §5.3)
        # Invariant 8: every `always()` usage must have a justification
        # comment within 10 lines containing one of: always, load-bearing,
        # cascade, skip. always() propagation through needs-cascade was
        # the root mechanism of the #906/#910 cascade.
        entry: .github/scripts/lint-always-needs-comment.sh
        args: ['.github/workflows/']
        language: script
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false

  # ── SAST (Semgrep) ───────────────────────────────────────────────────
  - repo: https://github.com/semgrep/semgrep
    rev: v1.121.0
    hooks:
      - id: semgrep
        name: Semgrep SAST
        # Pinned to python3.9 because Semgrep's tracing/protobuf deps
        # are incompatible with Python 3.14 (google.protobuf raises
        # TypeError: Metaclasses with custom tp_new are not supported).
        # Developers must have python3.9 installed locally. On macOS this
        # ships with Command Line Tools at /Library/Developer/CommandLineTools/.
        # Ruleset matches the blocking CI step (.github/workflows/build.yml
        # line 77): .semgrep/ custom rules only. CI additionally runs
        # p/security-audit + p/owasp-top-ten as non-blocking community
        # checks (build.yml line 120) — those are intentionally excluded
        # from pre-commit to keep local runs fast.
        language_version: python3.9
        args:
          - --config=.semgrep/
          - --error
          - --quiet
        types_or: [javascript, ts, tsx, go]
        # prototypes/: vendored Claude Design HTML/JS exports; the design
        # runtime legitimately uses innerHTML templating + new Function() JSX
        # compilation. Local-browser mock code, never production (#204).
        exclude: '(node_modules|dist|out|coverage|\.test\.|tests/|prototypes/)'

  # ── Go (Control Plane) ────────────────────────────────────────────────────
  # rev bumped v2.10.1 -> v2.12.2 (#1623): v2.10.1's bundled gosec emitted
  # false-positive G704 (SSRF-via-taint) + G117 (exported-field-matches-secret)
  # findings on pre-existing files (cfkv, feedback, config, an oauth test) that
  # the newer gosec in v2.12.x no longer flags. rev bumped v2.12.2 -> v2.14.0
  # for Go 1.27: v2.12.2's Staticcheck panics building IR for the Go 1.27
  # standard library (#3656), and v2.13.2 cannot read Go 1.27.2's export data
  # ("export data version 5 is greater than maximum supported version 4"), so
  # every package fails typecheck. pre-commit builds this hook with the system Go,
  # and a golangci-lint built with Go 1.26 refuses a `go 1.27` module, so the
  # system Go must be 1.27 or newer (see docs/development.md).
  # This `rev` is ALSO the CI version: pr-ci.yml's advisory `golangci-lint` job
  # reads it from this file (repo URL line, then the `rev:` line directly under
  # it — keep them adjacent; the job fails closed if it cannot parse a vX.Y.Z).
  # No workflow ran golangci-lint from #373 (2026-03-24) until that job; an
  # earlier version of this comment claimed CI did.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint
        entry: bash -c 'cd services/control-plane && golangci-lint run --fix'
        pass_filenames: false

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: bash -c 'cd services/control-plane && go vet ./...'
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: gofmt
        name: gofmt
        entry: bash -c 'cd services/control-plane && gofmt -l -d . | head -20; test -z "$(gofmt -l .)"'
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: go-build
        name: go build
        entry: bash -c 'cd services/control-plane && go build ./...'
        language: system
        pass_filenames: false
        files: '\.go$'

  # ── TypeScript / React (Desktop Client) ───────────────────────────────────
  - repo: local
    hooks:
      # Pre-flight: fail fast with a friendly "run npm install" message if
      # client/desktop/node_modules is missing or older than package-lock.json.
      # Without this, prettier/eslint/tsc fail with opaque "Cannot find module"
      # errors after a pull that updated the lockfile. Runs first so the real
      # TS hooks can assume deps are present. The post-merge/post-checkout
      # auto-install hook (below) should make this rare in practice — this is
      # the safety net for anyone who bypasses that (e.g. `git checkout -f`).
      - id: check-node-modules-fresh
        name: client/desktop node_modules freshness
        entry: scripts/check-node-modules-fresh.sh
        args: [client/desktop]
        language: script
        pass_filenames: false
        # Must cover every extension the dependency-backed `prettier` hook below
        # runs on. That hook shells out to `npx prettier`, so it NEEDS node_modules;
        # this is the pre-flight that turns a stale install into "Run npm install"
        # instead of an opaque module error. The two matchers are a PAIR — widening
        # one without the other extends the hook past its own pre-flight.
        # ANCHORED to client/desktop like every other desktop-dependent hook:
        # unanchored, a client/admin .css or a media-plane .ts would invoke the
        # DESKTOP freshness check and fail an unrelated commit. The regex was
        # already unanchored before .mts/.css were added here, so widening the
        # extensions widened that false-trigger surface too.
        files: '^client/desktop/.*\.(ts|tsx|mts|css)$'
        # Path-segment anchored: the naive regex `node_modules|dist|out`
        # would match any path containing the substring "out" (e.g.
        # `layoutStore.ts`, `AboutUpdateSection.tsx`, `Layout/*.tsx`),
        # silently skipping the freshness check on those files. The
        # pre-existing prettier/eslint/tsc hooks below share this bug —
        # tracked as a follow-up.
        exclude: '(^|/)(node_modules|dist|out)($|/)'

      - id: prettier
        name: prettier
        # Forward pre-commit's changed-file args into the cd'd subshell,
        # stripping the client/desktop/ path prefix so they resolve relative
        # to the new cwd. Without "$@" forwarding (the previous form),
        # prettier ran with zero args and silently no-op'd the check.
        # The `--` before "${files[@]}" prevents filenames starting with `-`
        # from being mis-parsed as flags (CWE-88 defense-in-depth).
        entry: bash -c 'cd client/desktop && files=(); for f in "$@"; do files+=("${f#client/desktop/}"); done; exec npx prettier --check --ignore-unknown -- "${files[@]}"' --
        language: system
        files: '^client/desktop/.*\.(ts|tsx|mts|css)$'
        exclude: 'node_modules|dist|out|coverage'

      - id: eslint
        name: eslint
        # Forward pre-commit's changed-file args into the cd'd subshell,
        # stripping the client/desktop/ path prefix so they resolve relative
        # to the new cwd. Without "$@" forwarding (the previous form),
        # eslint ran against the whole src tree on every .ts/.tsx commit,
        # which made introducing scoped rules noisy (hits on unrelated files
        # blocked commits). See #706.
        # The `--` before "${files[@]}" prevents filenames starting with `-`
        # from being mis-parsed as flags (CWE-88 defense-in-depth).
        entry: bash -c 'cd client/desktop && files=(); for f in "$@"; do files+=("${f#client/desktop/}"); done; exec npx eslint --quiet -- "${files[@]}"' --
        language: system
        files: '^client/desktop/.*\.(ts|tsx)$'
        exclude: 'node_modules|dist|out|tests/'

      - id: tsc
        name: tsc --noEmit
        entry: bash -c 'cd client/desktop && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: '^client/desktop/.*\.(ts|tsx)$'
        exclude: 'node_modules|dist|out'

  # ── Commit message format ─────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: commit-msg-format
        name: commit message format
        entry: scripts/check-commit-msg.sh
        language: script
        stages: [commit-msg]
        always_run: true

  # ── [internal] counts drift (warn-only) ────────────────────────────────────
  # Runs the counts script in dry-run mode and prints a warning if [internal]'s
  # Key Counts paragraph has drifted from the live repo. Non-blocking: this
  # hook NEVER fails the commit — it's purely an informational nudge to run
  # `./scripts/update-claude-md-counts.sh --apply` when convenient.
  #
  # Also used as a signal by Claude Code: if this hook prints a drift warning,
  # Claude should offer to refresh counts as part of the current session
  # rather than waiting for a manual audit.
  - repo: local
    hooks:
      - id: claude-md-counts-drift
        name: [internal] counts drift (warn-only)
        entry: scripts/check-claude-md-counts-drift.sh
        language: script
        pass_filenames: false
        always_run: true
        verbose: true

  # ── Label-reference drift (strict, #1134) ────────────────────────────────
  # Validates label-name pattern references in modified `[internal]skills/**/*.md`
  # and `[internal]rules/**/*.md` files against the "Active labels" section of
  # `[internal]rules/labels.md`. Deprecated namespaces (theme:, system:, etc.)
  # FAIL strict mode — forces #1135 migration before further skill edits.
  #
  # Spec: [internal]specs/2026-05-21-1134-labels-skills-foundation-design.md
  - repo: local
    hooks:
      - id: check-label-references
        name: 'Validate label references against [internal]rules/labels.md (active section only)'
        entry: scripts/check-label-references.sh
        language: script
        files: '^\[internal](skills/.*\.md|rules/.*\.md)$'
        pass_filenames: true

      # ── Skill-dispatch-target lint (#1385) ──────────────────────────────────
      # Fails if any [internal]skills/*/SKILL.md instructs the MODEL to dispatch a
      # disable-model-invocation skill (which the harness rejects, making the
      # DISPATCH-GATE step unhonorable). pass_filenames:false — the script globs
      # ALL SKILL.md to build the complete DISABLED set regardless of which changed.
      # Spec: [internal]specs/2026-06-06-1385-skill-dispatch-gates-design.md
      - id: check-skill-dispatch-targets
        name: 'Forbid dispatching disable-model-invocation skills as model targets (#1385)'
        entry: scripts/check-skill-dispatch-targets.sh
        language: script
        # Fire on SKILL.md edits AND on dispatch-catalog edits — the lint checks
        # both surfaces (SKILL.md dispatch directives + catalog candidate entries).
        files: '^\[internal]skills/(.*/SKILL\.md|_shared/dispatchable-skills\.md)$'
        pass_filenames: false

      # ── Agent-dispatch target resolution ────────────────────────────────────
      # The agent counterpart to check-skill-dispatch-targets. Both dispatch
      # tables are the single source of truth for agent fan-out; the runtime
      # resilience rule downgrades an unknown target to a one-line WARN, which
      # would turn a renamed/deleted agent into a silent review gap. Fail loud
      # here instead. Fires on agent edits AND table edits — either side drifts.
      - id: check-agent-dispatch-targets
        name: 'Dispatch tables reference only agents that exist'
        entry: scripts/check-agent-dispatch-targets.sh
        language: script
        files: '^\[internal](agents/.*\.md|skills/_shared/(lifecycle|pr-review)-agent-dispatch\.md)$'
        pass_filenames: false

      - id: check-feature-wiring
        name: 'Every feature layer is reached by the layer above it'
        entry: scripts/check-feature-wiring.sh
        language: script
        files: '^(services/control-plane/(internal/api/router\.go|cmd/server/main\.go|internal/storage/registry\.go|pkg/config/config\.go)|client/desktop/src/renderer/(hooks/messaging/useFileUpload\.ts|components/Chat/MessageInput\.tsx)|docker-compose\.production\.yml|docs/api/openapi\.yaml|\.github/workflows/provision-secrets\.yml|scripts/check-feature-wiring\.sh|[internal]nginx/concordvoice\.conf|infrastructure/docker/nginx/nginx\.conf)$'
        pass_filenames: false

      - id: check-attachment-write-callers
        name: 'Attachment writes stay on their intended rails'
        entry: scripts/check-attachment-write-callers.sh
        language: script
        files: '^(services/control-plane/internal/media/.*\.go|scripts/check-attachment-write-callers\.sh)$'
        pass_filenames: false

      - id: test-check-agent-dispatch-targets
        name: 'Test agent-dispatch target lint'
        entry: scripts/test-check-agent-dispatch-targets.sh
        language: script
        files: '^scripts/(test-)?check-agent-dispatch-targets\.sh$'
        pass_filenames: false

      # ── Agent-catalog model/effort parity ───────────────────────────────────────
      # The catalog (the root AGENTS.md until 2026-09-26, now docs/agent-catalog.md)
      # was the only agent-describing surface with no parity check —
      # .github/agents, .github/skills, .github/instructions and .codex all have
      # one — and it rotted exactly as you would expect. PR #2805 retuned seven
      # agent pins plus their .codex mirrors and never touched AGENTS.md, leaving
      # nine of twenty-two rows lying for five months: @architect documented as
      # Fable (pinned opus), five sonnet reviewers documented as Opus, and three
      # stale effort values. Corrected in #2929; this hook stops the recurrence.
      # The agent FILES are authoritative — they are what the harness loads — so
      # the failure message says to fix the doc, never the pin. Fires on either
      # side, since either can drift away from the other.
      - id: check-agents-md-pins
        name: 'docs/agent-catalog.md Model/Effort matches the agent pins'
        entry: scripts/check-agents-md-pins.sh
        language: script
        files: '^(\[internal]agents/.*\.md|docs/agent-catalog\.md|scripts/check-agents-md-pins\.sh)$'
        pass_filenames: false

      - id: test-check-agents-md-pins
        name: 'Test agent-catalog pin-parity lint'
        entry: scripts/test-check-agents-md-pins.sh
        language: script
        files: '^scripts/(test-)?check-agents-md-pins\.sh$'
        pass_filenames: false

      # ── Documented paths are tracked ────────────────────────────────────────
      # Founding incident (PR #2443): [internal]workflows/design-panel.js was named
      # by ~10 doc surfaces as the canonical Phase-2 implementation but was
      # gitignored and untracked, so it was absent from the PR entirely. Every
      # local signal said it existed (on disk, and the Skill tool registered it
      # from disk) — an untracked-and-ignored file never even shows in git status.
      # FAILs only on the unambiguous shape: referenced AND on disk AND untracked.
      # A path that resolves to nothing at all is a WARN (prose shorthand,
      # deleted-file regression notes, and sibling-repo paths are all legitimate).
      - id: check-documented-paths-tracked
        name: 'Documented file paths are tracked by git'
        entry: scripts/check-documented-paths-tracked.sh
        language: script
        files: '^(CLAUDE\.md|AGENTS\.md|SECURITY\.md|docs/agent-catalog\.md|\.gitignore|\[internal](rules|skills|agents)/.*\.md)$'
        pass_filenames: false

      - id: test-check-documented-paths-tracked
        name: 'Test documented-paths lint'
        entry: scripts/test-check-documented-paths-tracked.sh
        language: script
        files: '^scripts/(test-)?check-documented-paths-tracked\.sh$'
        pass_filenames: false

      # ── Catalog-discipline test-lock ────────────────────────────────────────
      # Locks the prose disciplines added for Context7 docs, /deep-research
      # mode-gating, workflow-eagerness, and [internal] count refresh, so a skill
      # edit cannot silently revert them (the /deep-research entry started life as
      # a blanket "auto-dispatch in all modes" — this guards that regression).
      # FAILS on regression; if the change is intentional, update the test in the
      # same commit. House pattern: discipline rule -> test that locks it.
      - id: test-catalog-disciplines
        name: 'Catalog/skill disciplines intact (Context7, deep-research gating, workflow rung, counts)'
        entry: scripts/test-catalog-disciplines.sh
        language: script
        files: '^(\[internal]skills/((dev-lifecycle|issue-creation|enhanced-pr-review|review-pr)/SKILL\.md|_shared/(dispatchable-skills|context7-docs-discipline)\.md)|\.github/skills/review-pr/SKILL\.md|scripts/test-catalog-disciplines\.sh)$'
        pass_filenames: false

      # ── /dev-lifecycle Step 2.5 behavioral coverage (PR #2652) ──────────────
      # Executes the SHIPPED Step 2.5 snippet, extracted from SKILL.md, against a
      # hermetic mock `gh`. This is deliberately distinct from the prose-pinning
      # assertions in test-dev-lifecycle-modes.sh: during PR #2652 an implementation
      # that halted on any cross-reference (selecting the wrong PR, and halting an
      # OPEN epic) passed 13 doc-pin assertions. Greping the doc proves the doc is
      # right, never that the logic is. Wired here rather than left manual-only
      # because unrun coverage is decoration — it is the sole executor of this logic.
      - id: test-dev-lifecycle-step25
        name: '/dev-lifecycle Step 2.5 merged-PR detection (behavioral, mock gh)'
        entry: scripts/test-dev-lifecycle-step25.sh
        language: script
        files: '^(\[internal]skills/dev-lifecycle/SKILL\.md|scripts/test-dev-lifecycle-step25\.sh)$'
        pass_filenames: false

      # ── /dev-lifecycle Phase 7.5 arrival detection (PR #3266) ───────────────
      # Executes the SHIPPED Step 7.5.3a monitor against a hermetic mock `gh`.
      # Registered for the same reason as the suite above, and one more: this
      # failure mode is INVISIBLE without it. A stale or missing `ack_pattern`
      # makes the wait end EARLY, which is indistinguishable from success — the
      # phase reports ARRIVED and Phase 8 runs. `offline` drift produces a wait
      # that hangs and eventually gets noticed; this one never does. Both the
      # skill body and the roster are in scope because the suite asserts the LIVE
      # roster's pattern against a real ack body and a real verdict body, so an
      # ack_pattern-only edit must run these assertions (cf. #3121 Test 14b).
      - id: test-dev-lifecycle-phase75-arrival
        name: '/dev-lifecycle Phase 7.5 arrival detection (behavioral, mock gh)'
        entry: scripts/test-dev-lifecycle-phase75-arrival.sh
        language: script
        # Both roster paths are in scope because pin_pattern now asserts against the
        # generated `.codex` mirror too; without the widened selector a mirror-only edit
        # would not even run these assertions.
        files: '^(\[internal]skills/dev-lifecycle/SKILL\.md|\[internal]repo-config\.json|\.codex/repo-config\.json|scripts/test-dev-lifecycle-phase75-arrival\.sh)$'
        pass_filenames: false

      # ── /dev-lifecycle mode-matrix + mirror pins ────────────────────────────
      # This suite predates the hook list and was never registered, so its
      # assertions only ran when someone invoked it by hand — which is how six
      # of them sat red through the 2026-07-24 On-the-Loop re-anchoring and the
      # Phase 10 addition without anyone noticing. Registering it also makes the
      # three-way mirror pin (.claude / .github / .codex) actually execute;
      # PR #2652 added a Codex-parity assertion that would otherwise have been
      # dead on arrival, which is the same stale-mirror class it exists to catch.
      - id: test-dev-lifecycle-modes
        name: '/dev-lifecycle mode matrix + skill mirror pins'
        entry: scripts/test-dev-lifecycle-modes.sh
        language: script
        # Both repo-config.json paths are in scope because Test 14b asserts the Copilot roster
        # VALUE, not just the prose about it. Without them a roster-only edit — exactly the
        # revert this suite now guards against — would never run these assertions (#3121).
        files: '^(\[internal]skills/(dev-lifecycle|_shared|enhanced-pr-review|pr-creation)/|\.github/skills/(dev-lifecycle|_shared|pr-creation)/|\.codex/skills/(dev-lifecycle|pr-creation)/|\[internal]repo-config\.json$|\.codex/repo-config\.json$|scripts/(test-dev-lifecycle-modes|sync-codex-tooling)\.)'
        pass_filenames: false

      # ── /pr-creation lib.sh helper tests ────────────────────────────────────
      # Registered for the same reason as the suite above: 44 hermetic assertions
      # over parse_pr_closes / parse_pr_refs / pick_inheritance_source /
      # filter_inherited_labels / validate_pr_invariants existed since the skill
      # shipped but ran only when someone invoked them by hand. Unrun coverage is
      # decoration — this is the sole executor of that logic, and the
      # Refs-milestone regression it now pins (PR #2879) shipped under it.
      - id: test-pr-creation
        name: '/pr-creation lib.sh helpers'
        entry: scripts/test-pr-creation.sh
        language: script
        files: '^(\[internal]skills/pr-creation/lib\.sh|scripts/test-pr-creation\.sh)$'
        pass_filenames: false

      # board-op.sh carries the routing decision, the arg parser, the option-id
      # map, and the proxy-403 fallback. That fallback has now been dead THREE
      # times for three different reasons — a jq pipe eating the 403 body, then
      # `set -e` killing the script at `raw=$(...)` before `rc=$?` could run.
      # Each time it was "verified" by a manual mock-gh run that was never
      # checked in. Group 4 of this suite is the standing regression test.
      - id: test-board-op
        name: 'board-op.sh routing + proxy-403 fallback'
        entry: scripts/test-board-op.sh
        language: script
        files: '^scripts/(board-op|test-board-op)\.sh$'
        pass_filenames: false

      # ── cloud-setup.sh regression suite ─────────────────────────────────────
      # cloud-setup.sh runs as root on a throwaway cloud VM before Claude Code
      # starts, so nothing in CI ever executes it and a regression surfaces only
      # as a broken session someone has to debug from the far side. The suite is
      # hermetic — every external binary is stubbed or absent and PATH is
      # replaced rather than prepended, so it can never reach /opt, /etc,
      # /usr/local/bin, or the network no matter which branch the script takes.
      # Covers the four things that were only ever hand-verified: trusted-repo
      # selection, the fallback-hook stubs (including that destructive-commands
      # ALLOWS ordinary commands — a blanket deny bricks the session), deadline
      # accounting, and degraded-completion reporting.
      - id: test-cloud-setup
        name: 'cloud-setup.sh repo selection + hooks + deadline + degraded report'
        entry: scripts/test-cloud-setup.sh
        language: script
        files: '^scripts/(cloud-setup|test-cloud-setup)\.sh$'
        pass_filenames: false

      # ── ADR-number lint (#1559) ─────────────────────────────────────────────
      # Fails if [internal] has duplicate NNNN prefixes or an ADR missing from the
      # README index — the concurrent-merge collision class (#1282 resolved by
      # hand; #1549 recurred at 0019). pre-commit catches the single-author case;
      # the pr-ci.yml mirror (against the merge ref) catches the cross-PR race.
      - id: check-adr-numbers
        name: 'ADR numbers — unique prefixes + README-indexed (#1559)'
        entry: scripts/check-adr-numbers.sh
        language: script
        files: '^[internal].*\.md$'
        pass_filenames: false

      # ── Review-disposition merge gate ───────────────────────────────────────
      # The gate itself (scripts/check-review-dispositions.sh) takes a PR number
      # and queries the GitHub API, so it cannot run here — it runs at
      # /enhanced-pr-review Phase 4 and /dev-lifecycle Step 9.1. Its self-test is
      # hermetic (JSON fixtures + a PATH-shimmed gh) and IS wired, because several
      # of the gate's assertions are exit-code-invisible: a column-shift bug that
      # mislabelled every violation's file path left the exit codes correct and
      # the suite green until an output assertion was added.
      - id: test-check-review-dispositions
        name: review-disposition gate self-test (per-comment ledger)
        entry: bash scripts/test-check-review-dispositions.sh
        language: system
        files: '^scripts/(check|test-check)-review-dispositions\.sh$'
        pass_filenames: false

      # The guard lives INSIDE review-pr/SKILL.md, so the skill itself is a trigger:
      # editing the block must re-run the suite that proves it still refuses. The
      # suite parses the block out rather than copying it, and fails loudly if its
      # anchor moves -- a silent pass there would be worse than no test.
      - id: test-review-pr-agent-trust
        name: /review-pr reviewer-definition trust guard
        entry: bash scripts/test-review-pr-agent-trust.sh
        language: system
        # ALL THREE mirrored copies, not just the canonical one. The suite now
        # exercises each surface, and editing a generated copy alone previously ran
        # zero of its assertions -- which is exactly how both mirrors came to carry
        # a broken predicate while the source stayed green.
        files: '^(\.(claude|codex|github)/skills/review-pr/SKILL\.md|scripts/test-review-pr-agent-trust\.sh)$'
        pass_filenames: false

      # ── Copilot-mirror drift guard ──────────────────────────────────────────
      # .github/instructions/claude-<rule>.instructions.md are hand-maintained
      # Copilot mirrors of [internal]rules/<rule>.md (no auto-sync — project memory
      # ".github/skills Copilot mirror"). Their BODY (from the first H1) must stay
      # byte-identical to canonical; the YAML preamble (description/applyTo + the
      # mirror comment) is human-authored and preserved. Fires when either side is
      # edited OR the script changes. pass_filenames:false — the script globs every
      # [internal]rules/*.md itself to compare the full set. `--fix` regenerates.
      - id: check-instruction-mirrors
        name: 'Copilot mirrors (.github/instructions) match [internal]rules canonicals'
        entry: scripts/check-instruction-mirrors.sh
        language: script
        files: '^(\[internal]rules/.*\.md|\.github/instructions/claude-.*\.instructions\.md|scripts/check-instruction-mirrors\.sh)$'
        pass_filenames: false

      # ── Skill-mirror drift guard ────────────────────────────────────────────
      # .github/skills/<name>/ is a hand-maintained Copilot mirror of the canonical
      # [internal]skills/<name>/ (same no-auto-sync surface as above). Every file under
      # a canonical skill must exist byte-identical in the mirror, EXCEPT evals/
      # (author eval harnesses, not part of the Copilot review surface). The script's
      # GEMINI_SKILLS list is also mirrored to Gemini; stale generated files in those
      # Gemini subtrees are rejected. Watch all of .gemini/skills so adding a skill to
      # that list does not need a second edit here.
      - id: check-skill-mirrors
        name: 'Skill mirrors match [internal]skills canonicals'
        entry: scripts/check-skill-mirrors.sh
        language: script
        files: '^(\[internal]skills/.*|\.gemini/skills/.*|\.github/skills/.*|scripts/check-skill-mirrors\.sh)$'
        pass_filenames: false

      # ── Agent-mirror generation guard ───────────────────────────────────────
      # Unlike the skill mirrors above, .github/agents/*.agent.md is GENERATED from
      # [internal]agents/*.md — the two formats differ (Claude carries tools:/model:/
      # effort:/maxTurns:, Copilot a four-verb tools: array plus user-invocable:), so
      # parity is a transform, not a byte-copy. The generator derives the Copilot
      # tools: array and drops the `## Turn Budget` section, which instructs the agent
      # about maxTurns and has no Copilot counterpart.
      #
      # This surface was hand-maintained and unchecked until this change, and it rotted:
      # docs-writer AND docs-reviewer both missed the #1857 Brand tier, telling Copilot
      # that CHANGELOG.md is a Mid-tier doc. Watch both sides — the source so an agent
      # edit regenerates, the mirror so a hand-edit is rejected rather than silently
      # reverted on the next unrelated commit.
      - id: check-agent-mirrors
        name: 'Agent mirrors are generated from [internal]agents'
        entry: scripts/check-agent-mirrors.py
        language: script
        files: '^(\[internal]agents/.*\.md|\.github/agents/.*\.agent\.md|scripts/check-agent-mirrors\.py)$'
        pass_filenames: false

      - id: test-check-agent-mirrors
        name: 'Test agent-mirror generator'
        entry: scripts/test-check-agent-mirrors.sh
        language: script
        files: '^scripts/(check|test-check)-agent-mirrors\.(py|sh)$'
        pass_filenames: false

      # ── Codex-mirror drift guard ────────────────────────────────────────────
      # .codex/ is GENERATED from [internal] (rules, skills, agents, hooks, the two
      # config JSONs) plus .github/{skills,prompts} and the dev-tooling plugins —
      # same generated-not-copied relationship as check-agent-mirrors above. It had
      # no guard, and it rotted the same way: PR #2674's globs: -> paths: rename left
      # 13 rules files stale, and .codex/rules/{electron,frontend}.md turned out to
      # have been missing rule content since #2401/#2354. Watch both sides — sources
      # so an edit regenerates, .codex/ itself so a hand-edit is rejected.
      #
      # pre-commit only, never CI: dev_tooling_root() needs the sibling dev-tooling
      # checkout from the org workspace, which a CI runner does not have. `--check`
      # also cross-checks .codex/config.toml against .mcp.json, so that file is
      # watched too. Regenerate with the bare script, no flags.
      #
      # dev-tooling is the ONLY external root (since 2026-09-23). Until then
      # superpowers_root() read the user-level Codex plugin cache and
      # microsoft_foundry_root() read ~/.agents/skills, so a silent plugin update
      # changed this hook's input on one machine only: Codex moving Superpowers
      # 6.3.0 -> 6.4.1 made every mirrored commit fail here. Both are now pinned,
      # unhardened upstream snapshots in dev-tooling's plugins/. The in-repo
      # .codex/plugins/superpowers still CANNOT substitute as a source: it is the
      # hardened OUTPUT, and each Superpowers hardening step is a tripwire keyed to
      # upstream text, so it rejects its own output as input ("tombstone hardening
      # no longer applies cleanly"). Those tripwires are load-bearing: they catch a
      # re-vendored upstream silently dropping the hardening. The env overrides
      # (DEV_TOOLING_ROOT, SUPERPOWERS_ROOT, ...) are PREPENDED CANDIDATES, not
      # forced paths — a value whose marker file is absent silently falls through
      # to the real candidates, so they cannot be used to test root absence.
      #
      # This hook cannot see a commit that BYPASSES it. PR #2682 edited
      # [internal]rules/backend.md 11 days after this hook landed and still shipped a
      # stale mirror, so a --no-verify or hook-less commit is a demonstrated hole,
      # not a theoretical one. scripts/check-mirror-pairing.sh covers that in CI by
      # asserting pairing (no source roots needed) for the 1:1 rules/agents surfaces.
      - id: test-renderer-shell-free
        name: 'Test the Superpowers renderer shell-free gate'
        entry: bash scripts/test-renderer-shell-free.sh
        language: system
        files: '^(scripts/sync-codex-tooling\.py|scripts/test-renderer-shell-free\.sh)$'
        pass_filenames: false

      # fix_superpowers_upstream_bugs patches two upstream executing-plans defects. The sync
      # proves only that each anchor matched; this runs the committed, patched scripts.
      - id: test-superpowers-upstream-fixes
        name: 'Test the Superpowers upstream bug fixes'
        entry: bash scripts/test-superpowers-upstream-fixes.sh
        language: system
        files: '^(scripts/sync-codex-tooling\.py|scripts/test-superpowers-upstream-fixes\.sh|\.codex/skills/(executing-plans|subagent-driven-development)/scripts/.*)$'
        pass_filenames: false

      - id: check-codex-mirrors
        name: 'Codex mirrors (.codex) are generated from .claude + .github'
        entry: python3 scripts/sync-codex-tooling.py --check
        language: system
        files: '^(\[internal](agents|skills|rules|hooks)/.*|\[internal](repo-config|drift-remediation)\.json|\[internal]drift-remediation\.schema\.json|\.github/(skills|prompts)/.*|\.codex/.*|\.mcp\.json|scripts/sync-codex-tooling\.py)$'
        pass_filenames: false

      - id: test-graphify-query-persistence
        name: 'Graphify query persistence is explicit (#2531)'
        entry: scripts/test-graphify-query-persistence.sh
        language: script
        files: '^(\[internal]skills/graphify/.*|\.codex/skills/graphify/.*|\.gemini/skills/graphify/.*|\.github/skills/graphify/.*|\.github/workflows/pr-ci\.yml|\.gitignore|\.pre-commit-config\.yaml|scripts/(check-skill-mirrors|test-graphify-query-persistence)\.sh)$'
        pass_filenames: false

  # ── Compose manifest-coverage lint (#1246) ────────────────────────────────
  # Validates every build.context: in docker-compose.{yml,production.yml} is
  # present (as exact path OR via parent) in
  # [internal]deploy-manifest.txt. Defends against the #878
  # production-outage class at PR time.
  #
  # Default mode (no flag) = defensive: profile-gated services emit
  # ::warning:: rather than ::error::, giving the developer a forward-looking
  # nudge without blocking the commit. (There are no profile-gated contexts at
  # present — the sole member was removed in #1785 — but the mechanism and its
  # tests remain for the next one.)
  # CI uses --scope=production-active for strict mode (no WARN noise on PRs).
  #
  # Spec: [internal]specs/2026-05-29-1246-compose-manifest-coverage-lint-design.md
  - repo: local
    hooks:
      - id: check-compose-manifest-coverage
        name: 'Validate docker-compose build contexts against deploy-manifest'
        entry: scripts/check-compose-manifest-coverage.sh
        language: script
        files: '^(docker-compose(\.production)?\.yml|[internal]deploy-manifest\.txt)$'
        pass_filenames: false

  # ── Deploy-tree SCRIPT manifest coverage (sibling of the lint above) ───────
  # The lint above asks "is every compose BUILD CONTEXT shipped?". This one asks
  # "is every FILE A HOST SCRIPT INSTALLS FROM shipped?" — the same failure one
  # axis over, and previously ungated. backup-offsite.sh went through that gap:
  # shipped in #2957, never added to the manifest, so the rsync never delivered
  # it and provision-production.sh's installer warned-and-skipped on every run.
  # The off-site backup was never installed on production and nothing said so.
  - repo: local
    hooks:
      - id: check-deploy-manifest-script-coverage
        name: 'Validate deploy-script file references against deploy-manifest'
        entry: scripts/check-deploy-manifest-script-coverage.sh
        language: script
        files: '^[internal](deploy-manifest\.txt|provision-production\.sh|concord-ctl\.sh|post-rsync\.sh)$'
        pass_filenames: false

      - id: test-check-deploy-manifest-script-coverage
        name: 'Test deploy-script manifest-coverage lint'
        entry: scripts/test-check-deploy-manifest-script-coverage.sh
        language: script
        files: '^scripts/(check|test-check)-deploy-manifest-script-coverage\.sh$'
        pass_filenames: false

  # ── ADR-0018 IOC gate on the native addon build ───────────────────────────
  # native-audiocap.yml's addon-build leg runs `npm ci` on four matrix rows. It
  # first shipped with a standalone `pull_request` trigger, which ran that install
  # in parallel with the supply-chain verdict instead of after it — caught in
  # review, not by any gate. This pins the wiring: reusable workflow, invoked from
  # pr-ci.yml with `needs: ioc`, and ABSENT from main-ci.yml, whose every job
  # (including its own `ioc`) is hotfix-gated, so a node there would be skipped on
  # exactly the merges it was meant to cover.
  #
  # A static guard rather than adding the orchestrators to the `native` change
  # filter: that would run four native builds plus three sanitizer legs on every
  # pr-ci.yml edit, and pr-ci.yml is edited often. This runs in milliseconds.
  - repo: local
    hooks:
      - id: check-native-ioc-gate
        name: 'native-audiocap stays IOC-gated (ADR-0018)'
        entry: scripts/check-native-ioc-gate.sh
        language: script
        files: '^\.github/workflows/(native-audiocap|pr-ci|main-ci)\.yml$'
        pass_filenames: false

      - id: test-check-native-ioc-gate
        name: 'Test the native IOC-gate guard'
        entry: scripts/test-check-native-ioc-gate.sh
        language: script
        files: '^scripts/(check|test-check)-native-ioc-gate\.sh$'
        pass_filenames: false

  # ── JSF++ profile for the native audio capture core (ADR-0043 D3) ─────────
  # [internal]rules/native-audio.md declares AV 206/208/189/22/24/209 BINDING inside
  # concord-audiocap/rt/. These are the rules a reviewer reads past most easily —
  # a std::vector in an audio callback looks like ordinary C++ right up until it
  # allocates on a real-time thread and the user hears it. Local, not CI-only,
  # because the feedback is worth having before the push.
  #
  # The self-test is a separate hook on purpose: a guard that has stopped detecting
  # anything reports a clean rt/ and reads exactly like a pass.
  - repo: local
    hooks:
      - id: check-native-jsf-profile
        name: 'JSF++ profile — concord-audiocap/rt/ (ADR-0043)'
        entry: scripts/check-native-jsf-profile.sh
        language: script
        files: '^client/desktop/native/concord-audiocap/rt/.*\.(h|hpp|cc|cpp|mm)$'
        pass_filenames: false

      - id: test-check-native-jsf-profile
        name: 'Test the JSF++ profile guard (ADR-0043)'
        entry: scripts/test-check-native-jsf-profile.sh
        language: script
        files: '^scripts/(check|test-check)-native-jsf-profile\.sh$'
        pass_filenames: false

  # ── Test protect-sensitive.sh marker-file bypass (#1136) ──────────────────
  # Fires when either the hook script or its test harness changes. Runs the
  # full assertion harness; any failure blocks the commit. Catches regressions
  # in the marker-file authorization logic, the sanitization substitution, or
  # the existing PROTECTED_PATTERNS fall-through before they hit CI.
  #
  # Spec: [internal]specs/2026-05-21-1109-autonomy-framework-design.md
  - repo: local
    hooks:
      - id: test-protect-sensitive
        name: 'Test protect-sensitive.sh hook (marker-file bypass)'
        entry: scripts/test-protect-sensitive.sh
        language: script
        files: '^(\[internal]hooks/protect-sensitive\.sh|scripts/test-protect-sensitive\.sh)$'
        pass_filenames: false

  # ── Workflow-failure pattern register drift (warn-only) ───────────────────
  # Fires on commits that modify `.github/workflows/*.yml` and contain `if:`
  # clause changes. Prints a non-blocking nudge to consult
  # [internal]workflow-failure-patterns.md before pushing. Exit 0 always
  # unless the script itself errors.
  #
  # Spec: [internal]specs/2026-05-14-997-pattern-register-design.md §3.4
  - repo: local
    hooks:
      - id: workflow-pattern-register-drift
        name: workflow-failure pattern register drift (warn-only)
        entry: .github/scripts/check-pattern-register.sh
        language: script
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
        verbose: true

  # ── license-check Go source ↔ go.mod lockstep (#1326) ────────────────────
  # setup-go reads go.mod's exact selected patch directly into GOROOT, avoiding
  # a later toolchain module download that breaks go-licenses (#128 upstream).
  # Require the canonical go-version-file input and reject go-version overrides.
  # The existing hook delegates to the shared Docker/module alignment guard.
  - repo: local
    hooks:
      - id: check-license-check-go-pin
        name: 'license-check reads the canonical Go toolchain'
        entry: scripts/check-license-check-go-pin.sh
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^(\.github/workflows/license-check\.yml|services/control-plane/(go\.mod|Dockerfile(?:\.ops-agent)?)|scripts/check-license-check-go-pin\.sh|scripts/(?:test-)?check-go-toolchain\.py|\.pre-commit-config\.yaml)$'
        pass_filenames: false

  # ── No TCP-only PostgreSQL probes (#755) ─────────────────────────────────
  # Rejects direct TCP/HTTP-style probes against the PG primary or replica
  # ports (curl/wget against ":5432"/":5433", or `nc -z` against PG hosts).
  # Such probes trigger `LOG: invalid length of startup packet` on the PG
  # server because the prober sends HTTP/raw bytes, not a PG startup packet.
  # The hook detects direct invocations only — wrapper-function calls that
  # pass the port literal as a string argument are NOT caught and rely on
  # code review. See scripts/check-no-pg-tcp-probes.sh and
  # [internal]postgres-probe-investigation.md §2.1 for full coverage
  # tables and concrete examples (which file is allowlisted, so the literal
  # anti-patterns there don't trip the hook).
  - repo: local
    hooks:
      - id: no-pg-tcp-probes
        name: Forbid TCP-only probes against PostgreSQL (#755)
        entry: scripts/check-no-pg-tcp-probes.sh
        language: script
        # The Dockerfile/dockerfile alternatives use `(^|/)NAME$` form because
        # those files have no `.` extension prefix, so a `\.NAME$` pattern would
        # silently miss real Dockerfile paths in the repo (#779 review).
        files: '(\.(sh|yml|yaml)$|(^|/)(Dockerfile|dockerfile)$)'
        exclude: '^(node_modules/|\[internal]worktrees/)'
        pass_filenames: true

  # ── Go test Redis isolation (blocking, #2680) ─────────────────────────────
  # Every `go test` process allocates a private Redis logical DB via
  # internal/testhelpers/redistest. This hook is what keeps that true for
  # authors who have never heard of it: it bans the ways the original defect was
  # written — a raw flush (any casing, any quoting, incl. the Async variants), a
  # hand-rolled client, a hand-rolled URL. The redistest package is allowlisted
  # inside the script, since it legitimately owns all three.
  #
  # This hook is NOT the CI surface. Nothing in .github/ invokes `pre-commit`,
  # so a hook alone is invisible to a --no-verify commit, an uninstalled hook, or
  # a fork PR. pr-ci.yml's `static-guards` job runs the guard whole-tree AND this
  # self-test as explicit named steps — the same belt-and-braces the ADR-number
  # and provision-secrets drift-locks use. Both surfaces must move together.
  - repo: local
    hooks:
      - id: no-unscoped-redis-flush
        name: Forbid unscoped Redis flushes and hand-rolled clients in Go tests (#2680)
        entry: scripts/check-no-unscoped-redis-flush.sh
        language: script
        # testhelpers/*.go is in scope as well as *_test.go: testredis.go, where
        # the defect actually lived, is not a _test.go file.
        files: '(_test\.go$|^services/control-plane/internal/testhelpers/.*\.go$)'
        exclude: '^(node_modules/|\[internal]worktrees/)'
        pass_filenames: true

      # Locks the guard itself. Without this, an edit that weakens a regex
      # produces a silently permissive guard with no signal anywhere.
      - id: test-no-unscoped-redis-flush
        name: Test the Redis-isolation guard (#2680 self-test)
        entry: scripts/test-check-no-unscoped-redis-flush.sh
        language: script
        files: '^scripts/(check|test-check)-no-unscoped-redis-flush\.sh$'
        pass_filenames: false

      # Validates the reviewer roster AT THE POINT OF CHANGE. The disposition
      # gate reads its roster from the PR's BASE branch, so a PR that BREAKS the
      # roster is judged against the old good one -- it merges green and then
      # every SUBSEQUENT PR in the repo fails at exit 2. That is how #3276
      # played out. This moves the failure onto the PR that causes it.
      #
      # pass_filenames is FALSE deliberately. `files:` includes the gate script,
      # so that changing the gate's rules re-validates the roster against the
      # NEW rules in the same commit -- but with pass_filenames true, pre-commit
      # would hand the guard `check-review-dispositions.sh` itself as a roster
      # to parse. With it false the guard checks its own default set instead.
      - id: check-roster-shape
        name: 'Reviewer roster is usable before it lands (#3281)'
        entry: scripts/check-roster-shape.sh
        language: script
        files: '^(\[internal]repo-config\.json|\.codex/repo-config\.json|scripts/check-review-dispositions\.sh)$'
        pass_filenames: false
        always_run: true

      # Locks the guard itself, including the ceiling case: a typo'd login must
      # stay ACCEPTED, so the guard cannot drift stricter than the gate it
      # delegates to.
      - id: test-check-roster-shape
        name: 'Test the roster-shape guard (#3281 self-test)'
        entry: scripts/test-check-roster-shape.sh
        language: script
        files: '^scripts/(check|test-check)-roster-shape\.sh$'
        pass_filenames: false

      # Forbids single-return type assertions on decoded JSON in Go tests.
      # Such an assertion PANICS on a shape mismatch, and a panic aborts the
      # whole package test binary -- every other test reports as failed and the
      # assertion that tripped is buried. See #2811.
      - id: no-single-return-json-assertion
        name: Forbid single-return JSON type assertions in Go tests (#2811)
        entry: scripts/check-no-single-return-json-assertion.sh
        language: script
        files: '_test\.go$'
        exclude: '^(node_modules/|\[internal]worktrees/)'
        pass_filenames: true

      # Locks the guard's regex. Not hypothetical: the guard's first draft
      # passed its type pattern to awk single-escaped, which errored and then
      # matched nothing -- every must-not-flag probe passed vacuously.
      - id: test-no-single-return-json-assertion
        name: Test the JSON-assertion guard (#2811 self-test)
        entry: scripts/test-check-no-single-return-json-assertion.sh
        language: script
        files: '^scripts/(check|test-check)-no-single-return-json-assertion\.sh$'
        pass_filenames: false

  # ── drift-remediation.json validator (blocking) ───────────────────────────
  # Validates [internal]drift-remediation.json with the structural checks
  # implemented by scripts/validate-drift-remediation.sh (jq + grep; NOT
  # JSON-Schema validation — ajv is not in the repo's dev deps, see
  # [internal]specs/2026-04-23-763-drift-hook-integration-design.md
  # §3 for rationale) and enforces the invariants the docs-reviewer /
  # docs-writer agents depend on:
  #   * every hook id in the config exists in this .pre-commit-config.yaml
  #   * every script path in the config exists, is executable, and resolves
  #     inside REPO_ROOT (no .. traversal)
  #   * required fields present and typed: script (string starting with ./),
  #     description (string, min 10 chars)
  #   * optional fields typed when present: args (array of strings — both
  #     container AND each element), auto_apply (boolean)
  #   * no additional properties beyond the declared fields
  # Fails the commit on violation. A misconfigured remediation map is a
  # structural defect — docs-writer would silently fail to find the hook at
  # runtime, so fail-closed at commit time is correct.
  - repo: local
    hooks:
      - id: validate-drift-remediation
        name: drift-remediation config validator
        entry: scripts/validate-drift-remediation.sh
        language: script
        pass_filenames: false
        files: ^(\[internal]drift-remediation\.json|\[internal]drift-remediation\.schema\.json|\.pre-commit-config\.yaml|scripts/.+\.sh)$

  # ── Claude Code hook registrations resolve from any cwd, fail closed ─────
  # A bare `[internal]hooks/x.sh` exits 127 once the session has `cd`'d away from
  # the root, and the harness treats that as non-blocking, so protection hooks
  # silently stopped running. The check runs every command from a foreign cwd.
  - repo: local
    hooks:
      - id: check-hook-commands
        name: Check agent hook commands (Claude, Codex, Copilot) resolve from any cwd and fail closed
        entry: scripts/test-check-hook-commands.sh
        language: script
        files: '^(\[internal]settings\.json|\.codex/hooks\.json|\.github/hooks/[^/]+\.json|scripts/(test-)?check-hook-commands\.sh)$'
        pass_filenames: false

  # ── Git-hook installer PTY regression test (#1719) ───────────────────────
  # Ensures every generated hook disables pre-commit's color-only PTY path.
  # The PATH-stubbed test is hermetic: it installs no hooks or environments.
  - repo: local
    hooks:
      - id: test-install-git-hooks
        name: Test Git-hook installer PTY mitigation (#1719)
        entry: scripts/test-install-git-hooks.sh
        language: script
        files: '^scripts/(install|test-install)-git-hooks\.sh$'
        pass_filenames: false

  # ── graphify graph fetch staged-replacement test (#2651) ─────────────────
  # A failed or partial artifact download must leave the existing local bundle
  # byte-identical. The graphify hook keys on graph.json EXISTING, so a truncated
  # or half-replaced bundle is consumed as ground truth instead of falling back
  # to ripgrep. PATH-stubbed gh, scratch repo, no network.
  - repo: local
    hooks:
      - id: test-fetch-graphify-graph
        name: Test graphify graph fetch staged replacement (#2651)
        entry: scripts/test-fetch-graphify-graph.sh
        language: script
        files: '^scripts/(fetch|test-fetch)-graphify-graph\.sh$'
        pass_filenames: false

  # ── concord-dev.sh unit tests (#1113) ────────────────────────────────────
  # Runs the 4 test-concord-dev-*.sh files when scripts/concord-dev.sh,
  # any test file in scripts/tests/, or docker-compose.dev.yml changes.
  # The tests use PATH stubs (no docker daemon required) and real fork/kill
  # on sleep subprocesses for PID lifecycle coverage. Fast enough (~3s
  # total) to run on every relevant pre-commit.
  - repo: local
    hooks:
      - id: concord-dev-unit-tests
        name: concord-dev.sh unit tests
        entry: bash -c 'for t in scripts/tests/test-concord-dev-*.sh; do bash "$t" || exit 1; done'
        language: system
        files: '^(scripts/concord-dev\.sh|scripts/tests/test-concord-dev-.*\.sh|docker-compose\.dev\.yml)$'
        pass_filenames: false

      - id: test-nats-server-bootstrap
        name: native NATS test broker bootstrap contract
        entry: bash scripts/test-nats-server-bootstrap.sh
        language: system
        files: '^scripts/(test-tools/nats-server|test-nats-server-bootstrap)\.sh$'
        pass_filenames: false

  # ── Self-hosted deploy script tests (#1617) ──────────────────────────────
  # Runs installer, cert, wrapper, storage-helper and BYO model suites when their
  # inputs change. Shell suites stub externals; the BYO suite uses isolated
  # config-only Compose renders when available, with no daemon or network calls.
  - repo: local
    hooks:
      - id: selfhost-deploy-tests
        name: self-hosted deploy tests (installer + TLS + lifecycle + storage)
        entry: bash scripts/tests/run-selfhost-deploy-tests.sh
        language: system
        files: '^(\.pre-commit-config\.yaml|docker-compose(\.production)?\.yml|docker-compose\.(selfhost|byo-s3)\.yml|[internal]deploy-manifest\.txt|infrastructure/deploy/(install-selfhost\.sh|provision-cert\.sh|copy-certs\.sh|provision-production\.sh|concord-selfhost|concord-ctl\.sh|selfhost-port-posture\.py|selfhost-storage\.sh|selfhost-security-event-logging\.sh|selfhost-tls\.(sh|py)|tests/(Dockerfile\.selfhost-hook|selfhost-acceptance\.py|test-(selfhost-(storage|byo-s3|cert-delivery|tls-readiness|tls-callers|tls-selected-consumer|acceptance)|copy-certs)\.sh|test-selfhost-tls-selected-consumer\.py|test-copy-certs-labels\.py|(?:test_selfhost_(tls|acceptance)|selfhost_acceptance_support)\.py|selfhost-cert-test-tools\.sh|test-security-event-logging\.sh|test-control-plane-secrets\.sh|security_event_publication_test\.py))|infrastructure/docker/coturn/turnserver\.conf|scripts/tests/(run-selfhost-deploy-tests\.sh|test-(install-selfhost|provision-cert|concord-selfhost)\.sh|provision_cert_replacement_test\.py))$'
        pass_filenames: false

  # ── Healthwatch actor tests (#3107 / #3200) ──────────────────────────────
  # The four suites existed from PR #3185 but were wired into NOTHING — no
  # pre-commit hook, no CI workflow — so ~900 assertions ran only when somebody
  # typed the command. This closes the LOCAL half only: no workflow runs
  # pre-commit, so these suites still do not execute in CI, exactly as the
  # sibling selfhost-deploy-tests hook below has always been. A committer who
  # skips hooks skips these too. Regressions in an unrun suite protect nothing, and the
  # sibling hook above already matches provision-production.sh while running a
  # DIFFERENT suite: editing the provisioner therefore ran the self-hosted deploy
  # tests and not the contract test that pins the healthwatch digests.
  #
  # Same stubbing posture as that sibling: the suites PATH-stub docker, curl,
  # systemctl and flock and drive the actor with HW_ROOT pointed at a temp dir,
  # so no root, docker, network, or systemd is required.
  - repo: local
    hooks:
      - id: healthwatch-tests
        name: healthwatch actor tests (behaviour + contract + cron + interlock)
        entry: bash -c 'for t in [internal]tests/test-healthwatch.sh [internal]tests/test-healthwatch-contract.sh [internal]tests/test-healthwatch-cron.sh [internal]tests/test-healthwatch-interlock.sh; do bash "$t" || exit 1; done'
        language: system
        files: '^(infrastructure/deploy/(healthwatch/.*|provision-production\.sh|health-check-cron\.sh|concord-ctl\.sh)|[internal]tests/test-healthwatch.*\.sh)$'
        pass_filenames: false

  # ── provision-secrets envs: completeness (#2746 migration walkthrough) ───
  # The server-side .env heredoc runs under `set -euo pipefail`, so a name it
  # dereferences but the ssh-action never transmits is an unbound variable that
  # kills the canonical writer for /opt/concord/.env. CI cannot catch it — the
  # failure needs a real host — and the workflow only runs during provisioning
  # or rotation, so a regression hides until the next fresh provision.
  - repo: local
    hooks:
      - id: provision-secrets-envs
        name: "provision-secrets heredoc references are all transmitted via envs:"
        entry: bash -c './scripts/check-provision-secrets-envs.sh && ./scripts/check-provision-secrets-envs.sh --self-test'
        language: system
        files: '^(\.github/workflows/provision-secrets\.yml|scripts/check-provision-secrets-envs\.sh)$'
        pass_filenames: false

  # ── Public-IP resolution guard (#2746 migration walkthrough) ─────────────
  # provision-production.sh auto-detects PUBLIC_IP through an `a || b || c`
  # chain whose last arm (`hostname -I | awk '{print $1}'`) returns the PRIVATE
  # address on a multi-NIC host. It reaches coturn --external-ip and mediasoup
  # ANNOUNCED_IP, where a private value means voice connects and carries no
  # media. The test extracts the block from the script rather than copying it.
  - repo: local
    hooks:
      - id: public-ip-detection-tests
        name: provision-production public-IP resolution fails closed on private addresses
        entry: bash [internal]tests/test-public-ip-detection.sh
        language: system
        files: '^(infrastructure/deploy/(provision-production\.sh|tests/test-public-ip-detection\.sh)|infrastructure/docker/iptables/docker-user-rules\.sh)$'
        pass_filenames: false

      - id: managed-firewall-fast-tests
        name: managed firewall, caller and RTC parity fast tests
        entry: bash -c 'for t in [internal]tests/test-managed-firewall.sh [internal]tests/test-managed-firewall-caller.sh [internal]tests/test-rtc-parity-fixtures.sh; do bash "$t" || exit 1; done'
        language: system
        files: '^(\.pre-commit-config\.yaml|infrastructure/(docker/iptables/docker-user-rules\.sh|deploy/(deploy-manifest\.txt|provision-production\.sh|tests/(managed_firewall_(fixture|fake)\.py|managed-firewall-lab\.sh|test-(managed-firewall|managed-firewall-caller|rtc-port-ingress-parity|rtc-parity-fixtures)\.sh))))$'
        pass_filenames: false

  # ── Concord-built MinIO publication contract (#1220) ──────────────────
  # Hermetic structural and fail-closed registry-state tests. These run when
  # the source recipe, publisher, shared consumer, guards, or their tests change.
  - repo: local
    hooks:
      - id: test-publish-minio-image
        name: 'Test Concord-built MinIO publisher and consumer (#1220)'
        entry: bash scripts/tests/test-publish-minio-image.sh
        language: system
        files: '^(\.pre-commit-config\.yaml|\.github/workflows/publish-minio-image\.yml|(?:\.zap/)?docker-compose(?:\.[A-Za-z0-9_-]+)*\.ya?ml|infrastructure/deploy/(selfhost-storage\.sh|tests/test-selfhost-(storage|byo-s3)\.sh)|infrastructure/docker/minio/(Dockerfile|SOURCE-BUILD\.md|dependencies\.patch|minio\.openvex\.json)|scripts/(ci/check-oci-tag|tests/test-(publish-minio-image|check-oci-tag))\.sh)$'
        pass_filenames: false

      - id: test-check-oci-tag
        name: 'Test fail-closed OCI tag guard (#1220)'
        entry: bash scripts/tests/test-check-oci-tag.sh
        language: system
        files: '^(\.pre-commit-config\.yaml|scripts/(ci/check-oci-tag|tests/test-check-oci-tag)\.sh)$'
        pass_filenames: false

      - id: test-require-docker-engine
        name: 'Test Docker Engine publisher admission (#3692)'
        entry: bash scripts/tests/test-require-docker-engine.sh
        # The actual-workflow tests parse YAML; provision it independently of
        # the contributor's system Python, matching the CI requirements pin.
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^(\.pre-commit-config\.yaml|\.github/(workflows/(publish-buildtools-base|publish-minio-image|pr-ci)\.yml|ci/scan-relevance\.yml)|scripts/(ci/require-docker-engine|tests/test-require-docker-engine)\.sh)$'
        pass_filenames: false

      # The render step is shell embedded in workflow YAML, so nothing executed it
      # until this test did — the workflow itself only runs on a weekly cron, where
      # a crash looks identical to "nothing to update". PR #2760 shipped a
      # pipefail-sensitive version that opened no PR at all whenever `go mod tidy`
      # only removed (or only added) modules.
      - id: test-go-transitive-flush-render
        name: 'Test go-transitive-flush PR-body render (#1212)'
        entry: bash scripts/tests/test-go-transitive-flush-render.sh
        language: system
        files: '^(\.pre-commit-config\.yaml|\.github/workflows/go-transitive-flush\.yml|scripts/tests/test-go-transitive-flush-render\.sh)$'
        pass_filenames: false

  # ── Public-mirror leak guard (#1664) ─────────────────────────────────────
  # Alpha-side fail-closed backstop for the public-repo-mirror (#1663) §7
  # fix-at-source discipline. FAILS the commit if a public-destined file
  # re-accumulates either (a) a private-tree cross-reference ([internal],
  # docs/{adr,superpowers,runbooks,reference,ci,competitive-analysis}/,
  # infrastructure/{deploy,cloudflare,github}/, [internal], [internal]) or
  # (b) a publication-blocker literal ("remove before publication" /
  # "Drafting notes for review").
  #
  # pass_filenames:false — the script scans its own default path sets (the §7
  # fix-at-source surfaces + the public doc set) regardless of which file
  # changed, so cross-file consistency holds. Fires when any fix-at-source
  # surface or public doc is in the commit. The ~150 benign comment cross-refs
  # across services/ + client/ + the broader docs are owned by the mirror's
  # transform-at-mirror stage (a separate epic child), NOT this guard — see the
  # script header "SCOPE" note. CI runs the same script as a backstop.
  #
  # Spec: [internal]specs/2026-06-18-public-repo-mirror-design.md §5/§7/§8.
  - repo: local
    hooks:
      - id: check-public-mirror-leaks
        name: 'Public-mirror leak guard (private cross-refs + drafting notes) (#1664)'
        entry: scripts/check-public-mirror-leaks.sh
        language: script
        pass_filenames: false
        files: '^(services/control-plane/pkg/config/config\.go|services/media-plane/src/index\.ts|client/desktop/src/renderer/config\.ts|docs/architecture\.md|docs/privacy-policy\.md|docs/legal/(commercial-license|terms-of-service)\.md|docs/GETTING_STARTED\.md|docs/development\.md|docs/policies/(ai-generated-code-policy|update-trust-model|mcp-server-policy)\.md|README\.md|FAQ\.md|ARCHITECTURE\.md|CHANGELOG\.md|NOTICE\.md)$'

      # Run the guard's own test harness when the guard or its test changes.
      - id: test-check-public-mirror-leaks
        name: 'Test public-mirror leak guard (#1664)'
        entry: scripts/test-check-public-mirror-leaks.sh
        language: script
        files: '^scripts/(check|test-check)-public-mirror-leaks\.sh$'
        pass_filenames: false

      # Early-warning gitleaks scan of mirror-published files (#3088 follow-up).
      # No CI job runs gitleaks — only the post-merge mirror publish gate does —
      # so a PR can be green everywhere and still turn main's mirror red, which is
      # exactly what e757ea72d did. This hook moves the common case before the
      # commit.
      #
      # The standalone gitleaks hook above does NOT already cover this, for two
      # independent reasons. It scans the staged SOURCE diff, while Gate 1 scans
      # the assembled+transformed mirror snapshot — different files, different
      # bytes. And it passes no `--config`, so it auto-discovers the repo-root
      # .gitleaks.toml, which declares an [allowlist] and no [extend]; a gitleaks
      # config without `[extend] useDefault = true` REPLACES the default ruleset,
      # so as configured that hook currently matches nothing at all (verified: its
      # exact `git --pre-commit --staged` invocation reports "no leaks found" on
      # gitleaks' own AKIA test vector). This hook therefore passes
      # --config scripts/public-mirror/gitleaks-gate.toml explicitly rather than
      # inheriting root discovery. Repairing the root config is repo-wide work —
      # enabling the defaults surfaces ~987 pre-existing findings — and is
      # deliberately out of scope here. See [internal]public-mirror-operations.md §8.
      #
      # NOT a gate: publish-gates.sh stays authoritative and fail-closed. This one
      # exits 0 (with a WARN) when gitleaks is absent, so it never blocks a
      # developer who has not installed it — set CONCORD_REQUIRE_GITLEAKS=1 to
      # make that fatal. A green run here is not proof the mirror will publish.
      #
      # No `files:` filter on purpose: the script reads the published set from
      # scripts/public-mirror/filter-manifest.txt, the same file assemble.sh
      # reads, so the scope cannot drift from the mirror's own definition. A
      # regex here would be a second source of truth.
      - id: check-mirror-secret-scan
        name: 'Mirror secret scan — gitleaks on public-destined files (#3088)'
        entry: scripts/check-mirror-secret-scan.sh
        # always_run so a commit that only DELETES a mirror control file still
        # reaches the hook: pre-commit passes only files that still exist, so such
        # a commit supplies no filenames and the hook would otherwise be skipped
        # entirely. The script discovers staged deletions from the index itself
        # and exits immediately when nothing is published (#3093, Codex).
        always_run: true
        # verbose so the fail-OPEN warnings are actually SEEN. pre-commit hides a
        # passing hook's output, and every fail-open path here exits 0 by design --
        # gitleaks absent, gitleaks errored, an unreadable report, a failed
        # assembly, scanner-pin drift. Without this the hook prints "NOTHING WAS
        # SCANNED" to a stream nobody reads and renders as `Passed`, so the entire
        # warn-loudly-and-continue design was inert and the first visible signal
        # stayed the post-merge Gate 1 run -- the exact failure this hook exists to
        # prevent. The repo's other warn-only hooks already set this. Reported by
        # Codex, #3093.
        verbose: true
        # language: golang rather than script so pre-commit PROVISIONS gitleaks
        # into this hook's own environment. As a `language: script` hook it could
        # only see a system-wide gitleaks, and a contributor who installs tools
        # the documented way — through pre-commit — has none, so the hook took its
        # fail-open path and the promised early warning silently never ran for
        # most people. Reported by Codex on PR #3093.
        #
        # Pinned to the PUBLISHER's version (GITLEAKS_VERSION in
        # publish-public-mirror.yml), not to the standalone gitleaks hook above,
        # which tracks v8.24.3 for a different purpose. This hook exists to
        # predict Gate 1, so it must run the scanner Gate 1 runs — move this pin
        # when that workflow's moves. NOTE: `go install` leaves the version
        # string unset ("version is set by build process"), so `gitleaks version`
        # cannot confirm it; this pin is the authority.
        language: golang
        additional_dependencies:
          - 'github.com/zricethezav/gitleaks/v8@v8.30.1'

      - id: test-check-mirror-secret-scan
        name: 'Test mirror secret scan (#3088)'
        entry: scripts/test-check-mirror-secret-scan.sh
        # Same environment as the hook it tests, and for the same reason: the
        # suite gates every detection case on `command -v gitleaks`, so under a
        # pre-commit-only install it would skip precisely the cases that prove
        # the guard detects anything, and still report success.
        language: golang
        additional_dependencies:
          - 'github.com/zricethezav/gitleaks/v8@v8.30.1'
        files: '^scripts/(check|test-check)-mirror-secret-scan\.sh$'
        pass_filenames: false

      - id: test-public-mirror-assemble
        name: 'Test public-mirror assembler (#1665)'
        entry: scripts/public-mirror/test-assemble.sh
        language: script
        files: '^scripts/public-mirror/(assemble|test-assemble)\.sh$'
        pass_filenames: false
      - id: test-public-mirror-transform
        name: 'Test public-mirror transform (#1665)'
        entry: scripts/public-mirror/test-transform.sh
        language: script
        files: '^scripts/public-mirror/(transform|test-transform|lib)\.sh$'
        pass_filenames: false
      - id: test-public-mirror-gates
        name: 'Test public-mirror publish gates (#1665)'
        entry: scripts/public-mirror/test-publish-gates.sh
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^(\.pre-commit-config\.yaml|\.github/workflows/publish-public-mirror\.yml|scripts/public-mirror/(public-overlay/\.github/workflows/public-release-attestation\.yml|test-public-release-attestation\.py|(publish-gates|test-publish-gates|lib)\.sh))$'
        pass_filenames: false
      - id: test-public-mirror-release
        name: 'Test public-mirror release helpers (#1667)'
        entry: scripts/public-mirror/test-mirror-release.sh
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^(\.pre-commit-config\.yaml|scripts/public-mirror/(public-overlay/\.github/workflows/public-release-attestation\.yml|(mirror-release|test-mirror-release|lib)\.sh))$'
        pass_filenames: false

  # ── npm install auto-sync (post-merge / post-checkout) ────────────────────
  # When a pull, merge, or branch switch changes package-lock.json in
  # client/desktop/ or services/media-plane/, auto-run `npm install` in the
  # affected directory so local node_modules stays current after dependency
  # updates. Prevents the
  # confusing "Cannot find module" failures from tsc/eslint/prettier after
  # dependency updates land. Requires `post-merge` and `post-checkout` hook
  # types to be installed — scripts/install-git-hooks.sh handles that.
  - repo: local
    hooks:
      - id: test-npm-install-lockfile-sync
        name: Test npm install lockfile sync (#2459)
        entry: bash scripts/test-npm-install-if-lockfile-changed.sh
        language: system
        files: '^scripts/(npm-install-if-lockfile-changed|test-npm-install-if-lockfile-changed)\.sh$'
        pass_filenames: false
      # Fires only when a manifest or lockfile moves — the moments an override
      # can silently start forcing a consumer off its declared range. Runs per
      # workspace because the lint resolves `semver` from the package under
      # test (there is no root package.json). See PR #2709 for the incident.
      - id: override-range-lint-desktop
        name: override-range lint — client/desktop
        entry: node scripts/security/override-range-lint.mjs --dir client/desktop --minimum-version undici=6.28.1 --minimum-version undici=7.29.1 --minimum-version undici=8.10.2
        language: system
        files: '^client/desktop/(package\.json|package-lock\.json|\.override-range-baseline\.json)$'
        pass_filenames: false
      - id: override-range-lint-admin
        name: override-range lint — client/admin
        entry: node scripts/security/override-range-lint.mjs --dir client/admin --minimum-version undici=6.28.1 --minimum-version undici=7.29.1 --minimum-version undici=8.10.2
        language: system
        files: '^client/admin/(package\.json|package-lock\.json|\.override-range-baseline\.json)$'
        pass_filenames: false
      - id: override-range-lint-media-plane
        name: override-range lint — services/media-plane
        entry: node scripts/security/override-range-lint.mjs --dir services/media-plane
        language: system
        files: '^services/media-plane/(package\.json|package-lock\.json|\.override-range-baseline\.json)$'
        pass_filenames: false
      - id: override-range-lint-apple-sso-worker
        name: override-range lint — apple-sso-bridge Worker
        entry: node scripts/security/override-range-lint.mjs --dir [internal]workers/apple-sso-bridge --fail-on-stale --minimum-version undici=6.28.1 --minimum-version undici=7.29.1 --minimum-version undici=8.10.2
        language: system
        files: '^[internal]workers/apple-sso-bridge/(package\.json|package-lock\.json|\.override-range-baseline\.json)$'
        pass_filenames: false
      - id: override-range-lint-invite-worker
        name: override-range lint — invite-landing Worker
        entry: node scripts/security/override-range-lint.mjs --dir [internal]workers/invite-landing --fail-on-stale --minimum-version undici=6.28.1 --minimum-version undici=7.29.1 --minimum-version undici=8.10.2
        language: system
        files: '^[internal]workers/invite-landing/(package\.json|package-lock\.json|\.override-range-baseline\.json)$'
        pass_filenames: false
      # Guards the NOTICE.md regenerator's own behaviour. Hermetic (PATH-shimmed
      # npx/go), so it needs no node_modules and no Go toolchain — unlike the
      # regenerator itself, which is why only the TEST runs pre-commit and the
      # real --check runs in CI.
      - id: test-update-notice-md
        name: Test NOTICE.md drift guard (#2886)
        entry: bash scripts/test-update-notice-md.sh
        language: system
        files: '^scripts/(update-notice-md\.py|test-update-notice-md\.sh)$'
        pass_filenames: false
      - id: test-override-range-lint
        name: Test override-range lint (#2709)
        entry: bash scripts/security/test-override-range-lint.sh
        language: system
        files: '^scripts/security/(override-range-lint\.mjs|test-override-range-lint\.sh)$'
        pass_filenames: false
      # Fires when a manifest, the dependabot config, or the register itself
      # moves — the moments a held version can appear without a written reason.
      - id: pin-exception-lint
        name: pin-exception register covers every held version
        entry: node scripts/security/check-pin-exceptions.mjs .
        language: python
        # PyYAML through a PRE-COMMIT-MANAGED env, not the contributor's ambient
        # interpreter. `language: system` invoked ambient `python3`, and pre-commit
        # being a python application does NOT put PyYAML on that interpreter —
        # pre-commit's own venv has it, the contributor's python3 need not. A
        # contributor with pre-commit, node and python but no global PyYAML was
        # blocked from committing: fail-closed, but on a dependency the hook config
        # never provisioned (CodeRabbit, PR #3325). Version tracks
        # .github/requirements-pyyaml.txt — the audit suite asserts they match.
        additional_dependencies: ['PyYAML==6.0.3']
        # Every manifest in the checker's WORKSPACES must appear here, or editing it
        # does not even trigger the control — `pre-commit run pin-exception-lint
        # --files <worker package.json>` reported "no files to check" while the
        # worker manifests exact-pinned wrangler with no register entry (#3292).
        files: '^(\.github/(dependabot\.yml|dependency-pin-exceptions\.json|tools/license-checker/package\.json)|(client/(desktop|admin)|services/media-plane|[internal]workers/(apple-sso-bridge|invite-landing)|dev-tooling/concord-bridge)/package\.json|scripts/security/check-pin-exceptions\.mjs)$'
        pass_filenames: false
      - id: test-pin-exception-lint
        name: Test pin-exception lint (#2769)
        entry: bash scripts/security/test-check-pin-exceptions.sh
        language: python
        # PyYAML through a PRE-COMMIT-MANAGED env, not the contributor's ambient
        # interpreter. `language: system` invoked ambient `python3`, and pre-commit
        # being a python application does NOT put PyYAML on that interpreter —
        # pre-commit's own venv has it, the contributor's python3 need not. A
        # contributor with pre-commit, node and python but no global PyYAML was
        # blocked from committing: fail-closed, but on a dependency the hook config
        # never provisioned (CodeRabbit, PR #3325). Version tracks
        # .github/requirements-pyyaml.txt — the audit suite asserts they match.
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^scripts/security/(check-pin-exceptions\.mjs|test-check-pin-exceptions\.sh)$'
        pass_filenames: false
      # Fires when dependabot.yml moves, because that is the edit that can leave an
      # update root unwatched, and when any update root APPEARS or disappears — a new
      # manifest, go.mod, Dockerfile or composite action is the other direction of the
      # same drift. Deliberately NOT gated on every package.json in the tree: a nested
      # dependency-free helper is not an update root, and the audit's own npm leg is
      # what decides that.
      - id: dependabot-coverage-audit
        name: dependabot watches every update root in the tree
        entry: bash scripts/security/audit-dependabot-coverage.sh
        language: python
        # PyYAML through a PRE-COMMIT-MANAGED env, not the contributor's ambient
        # interpreter. `language: system` invoked ambient `python3`, and pre-commit
        # being a python application does NOT put PyYAML on that interpreter —
        # pre-commit's own venv has it, the contributor's python3 need not. A
        # contributor with pre-commit, node and python but no global PyYAML was
        # blocked from committing: fail-closed, but on a dependency the hook config
        # never provisioned (CodeRabbit, PR #3325). Version tracks
        # .github/requirements-pyyaml.txt — the audit suite asserts they match.
        additional_dependencies: ['PyYAML==6.0.3']
        # `(.*/)?` not `.*/`: the latter REQUIRES a slash, so a root-level
        # package.json or go.mod never triggered the hook and a new root-level
        # update root could land uncovered (CodeRabbit, PR #3325).
        files: '^(\.github/(dependabot\.yml|actions/.*/action\.ya?ml)|(.*/)?(package\.json|go\.mod)|.*Dockerfile.*|.*requirements.*\.txt)$'
        pass_filenames: false
      - id: test-dependabot-coverage-audit
        name: Test dependabot coverage audit (#3325)
        entry: bash scripts/security/test-audit-dependabot-coverage.sh
        language: python
        # PyYAML through a PRE-COMMIT-MANAGED env, not the contributor's ambient
        # interpreter. `language: system` invoked ambient `python3`, and pre-commit
        # being a python application does NOT put PyYAML on that interpreter —
        # pre-commit's own venv has it, the contributor's python3 need not. A
        # contributor with pre-commit, node and python but no global PyYAML was
        # blocked from committing: fail-closed, but on a dependency the hook config
        # never provisioned (CodeRabbit, PR #3325). Version tracks
        # .github/requirements-pyyaml.txt — the audit suite asserts they match.
        additional_dependencies: ['PyYAML==6.0.3']
        files: '^scripts/security/(audit-dependabot-coverage\.sh|test-audit-dependabot-coverage\.sh|check-pin-exceptions\.mjs)$'
        pass_filenames: false
      - id: npm-install-lockfile-sync
        name: npm install if lockfile changed
        entry: scripts/npm-install-if-lockfile-changed.sh
        args: [client/desktop, services/media-plane]
        language: script
        stages: [post-merge, post-checkout]
        always_run: true
        pass_filenames: false
        verbose: true
